<!-- Script to handle fetching data and rendering charts -->
<script>



  	 // Function to generate random dark color
	    function getRandomDarkColor() {
	        var letters = '0123456789ABCDEF';
	        var color = '#';
	        for (var i = 0; i < 6; i++) {
	            color += letters[Math.floor(Math.random() * 16)];
	        }
	        return color;
	    }

	    // Function to fetch data and update charts

	    function fetchDataAndDisplayCharts(fromDate, toDate, zone, division, hallid,userType) {

	       var apiUrl = "/victoriahallbooking_uat/admin/api/bookingstatistics";
		   var queryParams = [];
		    if (fromDate) {
		        queryParams.push("fromDate=" + encodeURIComponent(fromDate));
		    }
		    if (toDate) {
		        queryParams.push("toDate=" + encodeURIComponent(toDate));
		    }
		    if (zone) {
		        queryParams.push("zone=" + encodeURIComponent(zone));
		    }
		    if (division) {
		        queryParams.push("division=" + encodeURIComponent(division));
		    }
		    if (hallid){
		    	queryParams.push("hallid=" + encodeURIComponent(hallid));
		    }
		    if (userType) {
		        queryParams.push("userType=" + encodeURIComponent(userType));
		    }

		    if (queryParams.length > 0) {
		        apiUrl += "?" + queryParams.join("&");
		    }

	        //console.log("API URL:", apiUrl);


	        $.ajax({
	            url: apiUrl,
	            type: "GET",
	            dataType:'json',
	            success: function(response) {

	            	// console.log('overallreports:',response);

	                     const data = response;
	                     // console.log('Parsed Data:', data);


	                  // Check and create charts if data is available, otherwise display an image

	                  	  if (data.main && Object.keys(data.main).length > 0) {
				            document.getElementById('totalBookings').innerText = data.main.total;
				            document.getElementById('totalAmount').innerText = "Rs." + data.main.main_total_amount;
				            document.getElementById('totalRefundedAmount').innerText = "Rs." + data.main.main_refunded_amount;
				            document.getElementById('netAmount').innerText = "Rs." + data.main.main_net_amount;
				            document.getElementById('gstAmount').innerText = "Rs." + data.main.main_gst_amount;

                  animateAmount('totalBookings', data.main.total, 2000); // Duration in milliseconds
                animateAmount('totalAmount', data.main.main_total_amount, 2000); // Duration in milliseconds
                animateAmount('totalRefundedAmount', data.main.main_refunded_amount, 2000); 
                animateAmount('netAmount', data.main.main_net_amount, 2000);
                animateAmount('gstAmount', data.main.main_gst_amount, 2000);

				        }

	                  	  else{
							document.getElementById("totalBookings").innerHTML = `
                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
                		        <img src='/images/nodata_pic.png' alt='No data available' width='50' height='50' />
                		    </div>
                		`;
							document.getElementById("totalAmount").innerHTML = `
                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
                		        <img src='staticimages/nodata-founds.png' alt='No data available' width='50' height='50' />
                		    </div>
                		`;
							document.getElementById("netAmount").innerHTML = `
                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
                		        <img src='media/images/nodata-founds.png' alt='No data available' width='50' height='50' />
                		    </div>
                		`;
                		document.getElementById("totalRefundedAmount").innerHTML = `
                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
                		        <img src='/images/nodata_pic.png' alt='No data available' width='50' height='50' />
                		    </div>
                		`;document.getElementById("gstAmount").innerHTML = `
                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
                		        <img src='/images/nodata_pic.png' alt='No data available' width='50' height='50' />
                		    </div>
                		`;
	                  	  }
	                     if (data.bookingStatus && Object.keys(data.bookingStatus).length > 0) {
	                         createDonutChart("booking-status-chartdiv", data.bookingStatus, "Booking Status","bookingStatus");
	                     } else {
	                    	 document.getElementById("booking-status-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }

	                     if (data.refundStatus && Object.keys(data.refundStatus).length > 0) {
	                         createDonutChart("refund-status-chartdiv", data.refundStatus, "Refund Status","refundStatus");
	                     } else {
	                    	 document.getElementById("refund-status-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
<!--	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }

	                     if (data.reason && Object.keys(data.reason).length > 0) {
	                         createReasonChart("reason-chartdiv", data.reason, "Event Types");
	                     } else {
	                    	 document.getElementById("reason-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }

	                     if (data.zonewise && Object.keys(data.zonewise).length > 0) {
	                         createZoneChart("zonewise-chartdiv", data.zonewise, "Zonewise Bookings","zonewise");
	                     } else {
	                    	 document.getElementById("zonewise-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }

	                    		     if (data.paymentStatus && Object.keys(data.paymentStatus).length > 0) {
	                         createZoneCharts("paymentStatus-chartdiv", data.paymentStatus, "Paymentstatus Bookings","paymentStatus");
	                     } else {
	                    	 document.getElementById("paymentStatus-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }
            if (data.past_future && Object.keys(data.past_future).length > 0) {
	                    	// Extract only the desired fields
	                    	    const filteredData = {
	                    	        "PAST_Events": data.past_future.PAST_Events,
	                    	        "FUTURE_Events": data.past_future.FUTURE_Events
	                    	    };
	                         createZoneCharts("past_future-chartdiv", filteredData, "Booking Summary","past_future");
	                     } else {
	                    	 document.getElementById("past_future-chartdiv").innerHTML = `
	                    		    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
	                    		        <img src='media/images/nodata-founds.png' alt='No data available' width='100' height='100' />
	                    		    </div>
	                    		`;	                     }

	             },
	            error: function(error) {
	                console.error("Error fetching data:", error);
	            }
	        });
	    }


	    // Initial call to fetch and display charts with default parameters or initial load

	    fetchDataAndDisplayCharts();

	    // Example of handling date input changes to update charts
	     document.getElementById("filterButton").addEventListener("click", function(event) {
		    event.preventDefault();
		    var fromDate = document.getElementById("fromDate").value;
		    var toDate = document.getElementById("toDate").value;
		    var zone = document.getElementById("zone1").value;
		    var division = document.getElementById("division1").value;
		    var hallid = document.getElementById("hall1").value;
		    var userType = document.getElementById("userType").value;

		    fetchDataAndDisplayCharts(fromDate, toDate, zone, division, hallid ,userType);
		});

	     function formatValue(value) {
	    	    value = Number(value); // Ensure the value is a number

	    	    if (value >= 1e9) {
	    	        return (value / 1e9).toFixed(2) + ' Billion';
	    	    } else if (value >= 1e6) {
	    	        return (value / 1e6).toFixed(2) + ' Million';
	    	    } else if (value >= 1e5) {
	    	        return (value / 1e5).toFixed(2) + ' Lakh';
	    	    } else if (value >= 1e4) {
	    	        return (value / 1e4).toFixed(2) + ' Thousand';
	    	    }
	    	    return value.toFixed(2);
	    	}
	    	
	    	
	    	
	   // colors for each field
		function getColorByCategory(category, key) {
			 const colors = {
				        bookingStatus: {
				            "PENDING": "#DBAE58",   // Orange
				            "APPROVED": "#B3C100",  // Greenish
				            "REJECTED": "#D32D41",
				            "COMPLETED" : "#009900",
				            "CANCELED" : "#ff9933",
				            "PAYMENT_FAILURE": "#b35900",
				            "GCC_BLOCKED" : "#ff6600"
				        },
				        refundStatus: {
				            "WAITING": "#D32D41",   
				            "INITIATED": "#DBAE58", 
				            "APPROVED": "#B3C100"   	    		        
				        },
				        past_future:{
							"PAST_Events":"#D32D41",
							"FUTURE_Events":"#B3C100"
				        },
				        paymentStatus:{
							"Not Completed":"#D32D41",
							"Success": "#B3C100"
				        },
				        zonewise:{
							"01":"#46659b",
							"02":"#46659b",
							"03":"#46659b",
							"04":"#46659b",
							"05":"#46659b",
							"06":"#46659b",
							"08":"#46659b",
							"07":"#46659b",
							"09":"#46659b",
							"10":"#46659b",
							"11":"#46659b",
							"12":"#46659b",
							"13":"#46659b",
							"14":"#46659b",
							"15":"#46659b",
				        }

function animateAmount(elementId, targetAmount, duration) {
    const element = document.getElementById(elementId);
    let startTime = null;
    const startAmount = 0;

    function updateAmount(currentTime) {
        if (!startTime) startTime = currentTime;
        const progress = Math.min((currentTime - startTime) / duration, 1);
        const animatedAmount = Math.floor(progress * targetAmount);

        if (elementId === 'totalAmount' || elementId === 'netAmount' || elementId === 'totalRefundedAmount' || elementId === 'gstAmount') {
            element.innerText = "Rs. " + animatedAmount; // Format with commas and prepend "Rs."
        } else {
            element.innerText = animatedAmount; // Format with commas
        }

        if (progress < 1) {
            requestAnimationFrame(updateAmount);
        } else {
            if (elementId === 'totalAmount' || elementId === 'netAmount' || elementId === 'totalRefundedAmount' || elementId === 'gstAmount') {
                element.innerText = "Rs. " + targetAmount; // Ensure it ends exactly at targetAmount
            } else {
                element.innerText = targetAmount; // Ensure it ends exactly at targetAmount
            }
        }
    }

    requestAnimationFrame(updateAmount);
}




//Function to generate random dark color and ensure uniqueness
function getRandomDarkColor(existingColors) {
    var letters = '0123456789ABCDEF';
    var color = '#';
    do {
        color = '#';
        for (var i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }
    } while (existingColors.has(color) || !isDarkColor(color));
    
    existingColors.add(color);
    return color;
}

// Helper function to check if the color is dark
function isDarkColor(color) {
    // Convert hex color to RGB
    var r = parseInt(color.slice(1, 3), 16);
    var g = parseInt(color.slice(3, 5), 16);
    var b = parseInt(color.slice(5, 7), 16);

    // Calculate brightness using the formula for luminance
    var brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
    
    // Return true if the color is dark (brightness < 0.5)
    return brightness < 0.5;
}

document.addEventListener('DOMContentLoaded', function() {
            const fromDate = document.getElementById('fromDate');
            const toDate = document.getElementById('toDate');

            // Initially disable the "To Date" field
            toDate.disabled = true;

            fromDate.addEventListener('change', function() {
                if (fromDate.value) {
                    // Enable the "To Date" field when "From Date" is selected
                    toDate.disabled = false;

                    // Get the selected "From Date"
                    const selectedFromDate = new Date(fromDate.value);

                 // Set the "To Date" minimum to the same day as the "From Date"
                    const sameDayString = selectedFromDate.toISOString().split('T')[0];
                    toDate.setAttribute('min', sameDayString);

                    // Set the "To Date" value to the next day by default
                    toDate.value = sameDayString;

                } else {
                    // Disable the "To Date" field if "From Date" is cleared
                    toDate.disabled = true;
                    toDate.value = ''; // Clear the "To Date" input
                }
            });
        });

        </script>
