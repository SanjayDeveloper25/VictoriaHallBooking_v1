    <script>
        var hallIdDuplicate;
        const urlParams = new URLSearchParams(window.location.search);
        const hallId = urlParams.get('hallId');
        $(document).ready(function () {
            if (hallId != null) {
                getHallDetails(hallId);
                hallIdDuplicate = hallId;
                $("#selecthall").val(hallId);
            }
        });


        var index = 0;
        var hall;

        // Initialize select2 with closeOnSelect option
        $("#selecthall").select2({
            closeOnSelect: true  // Ensures dropdown closes on selecting an option
        });

        // Force close dropdown on change (fallback for any conflict)
        $('#selecthall').on('change', function () {
            $(this).select2('close');
        });

        $.ajax({
            type: 'GET',
            url: '/victoriahallbooking_uat/user/api/gethallnames',
            success: function (response) {
                // Populate the dropdown options with the received hall names
                var selectHallDropdown = $('#selecthall');
                $.each(response, function (index, hall) {
                    if (hallId == hall.hallId) {
                        selectHallDropdown.append($('<option></option>').attr('value', hall.hallId).text(hall.hallName));
                        selectHallDropdown.find('option[value="' + hall.hallId + '"]').prop('selected', true);
                    } else {
                        selectHallDropdown.append($('<option></option>').attr('value', hall.hallId).text(hall.hallName));
                    }
                });
            },
            error: function (xhr, status, error) {
                console.error('Error fetching hall names:', error);
            }
        });

        $(document).ready(function () {
            $('#selecthall').change(function () {
                var selectedHallId = $(this).val();
                // Call the getHallDetails function with the selected hall ID
                // urlParams.set('hallId', selectedHallId);
                hallIdDuplicate = selectedHallId;
                getHallDetails(selectedHallId);
            });
        });

        // Function to retrieve hall details based on hallId
        function getHallDetails(hallId) {
            $.ajax({
                type: 'GET',
                url: '/victoriahallbooking_uat/user/api/gethalldetails/' + hallId,
                success: function (response) {
                    // console.log(response);
                    // Display the container
                    $('#hallDetailsContainer').show();

                    // Set hall details
                    $('#zone').html('<strong>' + response.zone + '</strong>&nbsp;&nbsp;&nbsp;&nbsp; Division: <strong>' + response.division + '</strong>');
                    $('#address').html('<strong>' + response.doorNo + ', ' + response.street + ', ' + response.area + ', ' + response.city + ', ' + response.pinCode + '</strong>');
                    $('#landmark').html('<strong>' + response.landMark + '</strong>');
                    $('#seatingCapacity').html('<strong>' + response.seatingCapacity + '</strong>');
                    var parkingCapacity = response.parkingCapacity;
                    var parkingAvailability = parkingCapacity > 0 ? "Yes" : "No";
                    $('#parkingCapacity').html('<strong>' + parkingAvailability + '</strong>');
                    $('#caretakerNumber').html('<strong>' + response.hallInchargeMobno + '</strong>');
                    $('#rentAmount').html('<strong>' + response.depositAmount + '</strong>');
                    $('#gst').html('<strong>' + response.gst + '</strong>');
                    $('#fullDayAmount').html('<strong>' + response.fullDayRent + '</strong>');
                    // $('#halfrentAmount').html('<strong>' + response.halfDepositAmount + '</strong>');
                    // $('#halfDayAmount').html('<strong>' + response.halfDayRent + '</strong>');
                    // $('#ebunit').html('<strong>' + response.ebCostPerUnit + '</strong>');
                    $('#statichallId').val(response.hallId);

                    // Set hall images
                    var carouselInner = $('#hallImagesCarousel .carousel-inner');
                    carouselInner.empty(); // Clear existing images

                    $.each(response.hallImagesList, function (index, image) {
                        var itemClass = (index === 0) ? 'carousel-item active' : 'carousel-item';
                        var img = $('<img>').addClass('d-block w-100').attr('src', image.hallImage).attr('alt', 'Hall Image');
                        var carouselItem = $('<div>').addClass(itemClass).append(img);
                        carouselInner.append(carouselItem);
                    });

                    // Clear existing floor details to prevent duplicates
                    $('#hallareainsqft').empty();

                    // Use a Set to store unique floor details
                    var uniqueFloorDetails = new Set();

                    $.each(response.floorDetailsList, function (index, hallarea) {

                        // Construct the text for each floor's details
                        var floorDetailText = hallarea.floor + " - " + hallarea.hallarea + " Sq.ft  ,";

                        // Add to the Set if it's not a duplicate
                        if (!uniqueFloorDetails.has(floorDetailText)) {
                            uniqueFloorDetails.add(floorDetailText);
                            // Append the floor details to the target element
                            $('#hallareainsqft').append('<strong>' + floorDetailText + '</strong>');
                        }
                    });

                    // Initialize ViewerJS on the carousel after images are loaded
                    initializeViewerJS();

                    getBookingCalendar(hallId);
                    //connectToWebSocket(hallId);

                    // Set hall details in Step 2 and Step 3
                    $('#hallNameDisplayStep2').text(response.hallName);
                    $('#hallNameDisplayStep3').text(response.hallName);
                    $('#zoneStep2').text(response.zone);
                    $('#zoneStep3').text(response.zone);
                    $('#divisionStep2').text(response.division);
                    $('#divisionStep3').text(response.division);
                },

                error: function (xhr, status, error) {
                    console.error('Error fetching hall details:', error);
                }
            });
        }


        function initializeViewerJS() {
            // Ensure ViewerJS initialization after images are added to the DOM
            var carouselInner = document.querySelector('#hallImagesCarousel .carousel-inner');
            var floordetails = document.querySelector('#hallareainsqft');

            // Destroy existing viewer instance if it exists
            if (carouselInner.viewer) {
                carouselInner.viewer.destroy();
            }
            if (floordetails.viewer) {
                floordetails.viewer.destroy();
            }
            // Initialize ViewerJS
            var viewer = new Viewer(carouselInner, {
                inline: false,
                viewed: function () {
                    viewer.zoomTo(0.5); // Adjust the zoom level here
                },
                toolbar: {
                    zoomIn: 4,
                    zoomOut: 4,
                    oneToOne: 4,
                    reset: 4,
                    prev: 4,
                    play: {
                        show: 4,
                        size: 'large',
                    },

                    next: 4,
                    rotateLeft: 4,
                    rotateRight: 4,
                    flipHorizontal: 4,
                    flipVertical: 4,
                },
            });
            carouselInner.viewer = viewer;
        }


        function getBookingCalendar(hall_id) {
            // Make an AJAX call to fetch booking data
            $.ajax({
                type: 'GET',
                url: '/victoriahallbooking_uat/user/api/getPastData',
                data: {
                    hall_id: hall_id
                },
                success: function (response) {
                    // console.log(response);
                    window.bookingResponse = {};
                    if (response && Array.isArray(response)) {
                        $("#startDateInput").datepicker("destroy");
                        for (var i = 0; i < response.length; i++) {
                            var dateString = datepickerFormat(response[i].bdate);
                            window.bookingResponse[dateString] = [response[i].morningSlot, response[i].eveningSlot, response[i].is_blocked];
                        }

                        initializeDatepickerWithColors(hall_id);
                        if (response.length == 0) {
                            initializeDatepickerWithColors(hall_id);
                        }
                    } else {
                        console.error('Invalid or empty response data.');
                    }
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching hall details:', error);
                }
            });
        }


        // Function to update the end date and slot availability

        function initializeDatepickerWithColors(hallId) {
            // Destroy existing datepicker to avoid duplicate initialization
            $("#datepicker-container").datepicker("destroy");

            const serverDate = new Date($("#serverDate").val() + "T00:00:00");
            // console.log("serverDate:", serverDate);

            const minDate = new Date(serverDate);
            minDate.setDate(minDate.getDate() + 30);

            const maxDate = new Date(serverDate);
            maxDate.setMonth(maxDate.getMonth() + 6);
            // console.log("Max Date: "+maxDate);

            // Initialize the datepicker
            $("#startDateInput,#datepicker-container").datepicker({
                dateFormat: "yy-mm-dd",
                minDate: minDate,
                maxDate: maxDate,
                beforeShowDay: function (eDate) {

                    const day = eDate.getDay(); // 0=Sun, 5=Fri, 6=Sat

                    // Allow only Friday, Saturday, Sunday
                    if (![0, 5, 6].includes(day)) {
                        return [false, "highlight-disabled", "Bookings allowed only on Fri, Sat & Sun"];
                    }
                    const dateString = $.datepicker.formatDate("yy-mm-dd", eDate);
                    const bookingStatus = window.bookingResponse[dateString] || {};

                    // const currentDate = new Date();
                    serverDate.setHours(0, 0, 0, 0); // Normalize current date to midnight
                    eDate.setHours(0, 0, 0, 0); // Normalize selected date to midnight

                    // Logic for other dates
                    if (eDate < serverDate) {
                        return [false, "highlight-disabled", "Slot not Available"];
                    }

                    const isToday = eDate.getTime() === serverDate.getTime();
                    const currentHour = new Date().getHours();
                    const isBefore6AM = currentHour < 6;
                    const isAfter2PM = currentHour >= 14;

                    // Block 3-day logic for specific event types
                    // const today = new Date();
                    const blockedDate = new Date(serverDate);
                    blockedDate.setDate(serverDate.getDate() + 2);

                    if (eDate <= blockedDate && window.isThreeDayBlock) {
                        return [false, "highlight-disabled", "Blocked due to event type"];
                    }

                    // Logic for today
                    if (isToday) {
                        if (isBefore6AM) {
                            // Before 6 AM: Allow full-day booking or adjust based on booking status
                            return handleBookingStatus(bookingStatus, "Full Day Available");
                        } else if (isAfter2PM) {
                            // After 2 PM: Block all bookings
                            return handleAfter2PM(bookingStatus);
                        } else {
                            // Between 6 AM and 2 PM: Check status and disable morning slots
                            return handleMorningSlots(bookingStatus);
                        }
                    }

                    return handleBookingStatus(bookingStatus, "Slot Available");
                },
            });

            // Show datepicker when hall is selected
            $('#selecthall').off('click').on('click', function () {
                $('#datepicker-container').datepicker('show');
            });

            // Handle changes in the start date input
            $("#startDateInput").on("change", function () {
                const selectedDate = $(this).val();
                const bookingStatus = window.bookingResponse[selectedDate] || {};
                const currentDate = new Date();
                const currentHours = currentDate.getHours();
                const currentDateString = currentDate.toISOString().split("T")[0];

                $("#startPeriodDropdown").val(0).prop("disabled", false);
                $("#endPeriodDropdown").val(0).prop("disabled", false);
                $("#numDaysCount").val('');
                validateForm();

                if (selectedDate === currentDateString && currentHours >= 6) {
                    $("#startPeriodDropdown").val(2).prop("disabled", true);
                } else if (bookingStatus[0]) {
                    $("#startPeriodDropdown").val(2).prop("disabled", true);
                } else if (bookingStatus[1]) {
                    $("#startPeriodDropdown").val(1).prop("disabled", true);
                }
                updateEndDate(selectedDate);
            });

            // Event type change logic
            $("#reasonforbooking").on("change", function () {
                const selectedEventType = $(this).find("option:selected").text().trim();
                window.isThreeDayBlock = ["Commercial", "State Govt Event", "Central Govt Event"].includes(selectedEventType);
                $("#datepicker-container").datepicker("refresh");
            });
        }

        function handleBookingStatus(bookingStatus, defaultMessage) {
            if (bookingStatus[2]) {
                return [true, "highlight-blue disabled", "GCC Blocked"];
            } /*else if (bookingStatus[3]) {
            return [true, "highlight-lightpink disabled", "Temporary Blocked"];
        } */else if (bookingStatus[0] && bookingStatus[1]) {
                return [true, "highlight-pink disabled", "Slot Occupied"];
            } else if (bookingStatus[0] && !bookingStatus[1]) {
                return [true, "highlight-pink disabled", "Slot Occupied"];
            } else if (!bookingStatus[0] && bookingStatus[1]) {
                return [true, "highlight-violet", "Only Morning Slot Available"];
            }
            return [true, "highlight-greens", defaultMessage];
        }

        // Helper function: Handles logic after 2 PM
        function handleAfter2PM(bookingStatus) {
            if (bookingStatus[2]) {
                return [true, "highlight-blue disabled", "GCC Blocked"];
            } else if (bookingStatus[0] || bookingStatus[1]) {
                return [true, "highlight-pink disabled", "Slot Occupied"];
            }
            return [false, "highlight-disabled", "Not Allowed to Book"];
        }

        // Helper function: Handles morning slots between 6 AM and 2 PM
        function handleMorningSlots(bookingStatus) {
            if (bookingStatus[2]) {
                return [true, "highlight-blue disabled", "GCC Blocked"];
            } else if (bookingStatus[0] && bookingStatus[1]) {
                return [false, "highlight-pink disabled", "Slot Occupied"];
            } else if (bookingStatus[0] && !bookingStatus[1]) {
                return [true, "highlight-pink disabled", "Slot Occupied"];
            } else if (!bookingStatus[0] && bookingStatus[1]) {
                return [false, "highlight-disabled", "Slot Occupied"];
            }
            return [true, "highlight-pink disabled", "Slot Occupied"];
        }

        function datepickerFormat(dateString) {
            var dateObject = new Date(dateString);
            var year = dateObject.getFullYear();
            var month = (dateObject.getMonth() + 1).toString().padStart(2, "0");
            var day = dateObject.getDate().toString().padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function calculatehallrent() {
            window.location.href = "/victoriahallbooking_uat/hallAmountCalculation?hallId=" + hallIdDuplicate;
        }

    </script>
