<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head-admin :: head}"></head>

<body>
<!-- Page Container -->
<div id="page-container"
     class="sidebar-o sidebar-dark enable-page-overlay side-scroll page-header-fixed page-header-dark">
    <!-- Side Overlay aside (right)-->
    <aside th:replace="~{fragments/aside-right :: aside}"></aside>
    <!-- END Side Overlay (right)-->

    <!-- Sidebar Nav-->
    <nav th:replace="~{fragments/nav-admin :: nav}"></nav>
    <!-- END Sidebar -->

    <!-- Header -->
    <header th:replace="~{fragments/header-admin :: header}"></header>
    <!-- END Header -->

    <!-- Main Container -->
    <main id="main-container">

        <!-- END Hero -->
        <!-- Page Content -->
        <div class="content">
            <div class="block block-rounded">
                <div class="block-header block-header-default">
                    <h3 class="block-title"> List of Halls</h3>
                    <div class="block-options">
                        <button type="button" class="btn-block-option" id="addButton" onclick="addnewhall()"><i
                                class="far fa-plus-square"></i> Add New Hall
                        </button>
                    </div>
                </div>
                <div class="block-content p-0">
                    <div class="p-sm-4 p-0">
                        <div class="table-responsive">
                            <table id="halldetailsList"
                                   class="table table-bordered table-striped table-vcenter js-dataTable-responsive">
                                <thead class="thead-light">
                                <tr class="table-bordered">
                                    <th class="text-center no-sort">S.No</th>
                                    <th class="text-center" width="20%">Hallname</th>
                                    <th class="text-center">Zone</th>
                                    <th class="text-center">Division</th>
                                    <th class="text-center">Status</th>
                                    <th class="text-center">Hall Images</th>
                                    <th class="text-center">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- Use Thymeleaf to loop through the bookingList -->
                                <tr th:each="list, i : ${halllist}" class="${halllist}" id="hallRow">
                                    <td th:text="${i.count}">0</td>
                                    <td class="text-center" th:text="${list.hallName}"></td>
                                    <td class="text-center" th:text="${list.zone}"></td>
                                    <td class="text-center" th:text="${list.division}"></td>
                                    <td class="text-center">
                                        <span class="badge bg-success" th:if="${list.isActive}">Active</span>
                                        <span class="badge bg-danger"
                                              th:unless="${list.isActive}">Deactivated</span>
                                    </td>
                                    <td class="text-center">
                                        <a class="view-button">
													<span class="badge bg-primary" style="cursor: pointer;"
                                                          th:onclick="viewHallImages([[${list.hallId}]])">View</span>
                                        </a>
                                        <a href="javascript:void(0);"
                                           th:onclick="return hallimageEdit([[${list.hallId}]]);"
                                           data-bs-toggle="tooltip" data-bs-animation="true"
                                           data-bs-placement="top" title="Edit Hall Image"><i
                                                class="fas fa-edit" style="font-size: 18px;"></i></a>
                                    </td>
                                    <td class="text-center">
                                        <a href="javascript:void(0);"
                                           th:onclick="return callview([[${list.hallId}]],0);"
                                           data-bs-toggle="tooltip" data-bs-animation="true"
                                           data-bs-placement="top" title="View Hall info"><i class="fa fa-eye"
                                                                                             style="font-size: 18px;"></i></a>
                                        <a href="javascript:void(0);"
                                           th:onclick="return callview([[${list.hallId}]],1);"
                                           data-bs-toggle="tooltip" data-bs-animation="true"
                                           data-bs-placement="top" title="Edit Hall Info"><i
                                                class="fas fa-edit" style="font-size: 18px;"></i></a>

                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- END Page Content -->
    </main>
    <!-- END Main Container -->
    <footer th:replace="~{fragments/footer2 :: footer}"></footer>
    <!-- END Footer -->
</div>

<!-- END Page Container -->

<div class="modal fade backdrop" id="editForm" data-backdrop="static" tabindex="-1" role="dialog"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form id="ownform" onsubmit="return editsubmit();">
                <div class="block block-rounded block-themed block-transparent mb-0">
                    <div class="block-header bg-primary-dark">
                        <h3 class="block-title" id="mtitle">Hall Information Edit Form</h3>
                        <div class="block-options">
                            <button type="button" class="btn-block-option" data-bs-dismiss="modal"
                                    aria-label="Close">
                                <i class="fa fa-fw fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="block-content row">
                        <input type="hidden" class="form-control text-center" name="id" id="idd" disabled/>
                        <div class="col-sm-4">
                            <label class="form-label" for="hallName">Hall Name:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="hallName" id="hallNam"
                                   required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="zone">Zone:*<span class="text-danger"></span></label>
                            <select class="form-select" name="zone2" id="zone2" required=""
                                    onchange="getDiv2(this);">
                                <option value="">---Select Zone---</option>
                            </select>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="division">Division:*<span
                                    class="text-danger"></span></label>
                            <select class="form-select" name="division2" id="division2" required="">
                                <option value="">---Select Div---</option>
                            </select>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="doorNo">Address:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="doorNo" id="doornoo"
                                   required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="street">Street:*<span class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="street" id="street"
                                   required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="pincode">Pincode:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="pincode" id="pincod"
                                   minlength="6" maxlength="6" pattern="[0-9]{6}" required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="area">Area:*<span class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="area" id="area" required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="InchargeMobno">Hall Incharge Mobile Number:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="InchargeMobno"
                                   id="InchargeMobno" minlength="10" maxlength="10" pattern="[0-9]{10}" required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="InchargeNamehall">Hall Incharge Name:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="InchargeNamehall"
                                   id="InchargeNamehall" required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="landmark">Landmark:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="landmark" id="landmar"
                                   required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="latitude">Latitude:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="latitude" id="latitu" required
                                   oninput="this.value = this.value.replace(/[^0-9.\-]/g,'').replace(/(\..*)\./g,'$1');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="longitude">Longitude:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="longitude" id="longitu"
                                   required
                                   oninput="this.value = this.value.replace(/[^0-9.\-]/g,'').replace(/(\..*)\./g,'$1');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="depositAmount">Full Day Deposit Amount:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="depositAmount" id="depositAmo"
                                   required oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="halfDepositAmount">Half Day Deposit Amount:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="halfDepositAmount"
                                   id="halfDepositAmo"
                                   required oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="fullDayAmount">Full Day Amount:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="fullDayAmount" id="fullDayAmo"
                                   required oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="halfDayAmount">Half Day Amount:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="halfDayAmount" id="halfDayAmo"
                                   required oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="parkingCapacity">Parking Capacity:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="parkingCapacity"
                                   id="parkingCapaci" required inputmode="numeric"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="seatingCapaci">Seating Capacity:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="seatingCapaci"
                                   id="seatingCapaci" required inputmode="numeric"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="ebNumber">Consumer Number:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="ebNumber" id="ebNumber"
                                   required minlength="9" maxlength="12" pattern="^[0-9-+*#]{9,12}$"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="ebCostPerUnit">EB Cost Per Unit:*<span
                                    class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="ebCostPerUnit"
                                   id="ebCostPerUnit" required
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '');"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="city">City:*<span class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="city" id="city" required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="gst">GST in %:*<span class="text-danger"></span></label>
                            <input type="text" class="form-control text-center" name="gst" id="updatedgstpercentage"
                                   required/>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="hallStatus">Hall Status:*<span
                                    class="text-danger"></span></label>
                            <select class="form-select" name="hallStatus" id="hallStatus" required="">
                                <option value="1">Activate</option>
                                <option value="0">Deactivate</option>
                            </select>
                        </div>
                    </div>
                    <div class="block-content block-content-full text-end bg-body" id="mbutton">
                        <button type="button" class="btn btn-sm btn-alt-secondary"
                                data-bs-dismiss="modal">Close
                        </button>
                        <button type="submit" class="btn btn-sm btn-primary">Update</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade backdrop" id="hallDetailsModal" data-backdrop="static" tabindex="-1" role="dialog"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <form action="/victoriahallbooking_uat/admin/saveHallDetails" id="hallform" method="post"
                  enctype="multipart/form-data">
                <div class="block block-rounded block-themed block-transparent mb-0">
                    <div class="block-header bg-primary-dark">
                        <h3 class="block-title" id="mtitle">Add New Hall</h3>
                        <div class="block-options">
                            <button type="button" class="btn-block-option" data-bs-dismiss="modal"

                                <i class="fa fa-fw fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="block-content row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-check-label" for="zone1">Select Zone*</label>
                                <select class="form-select" name="zone1" id="zone1" required=""
                                        onchange="getDiv(this);">
                                    <option val="">---Select Zone---</option>
                                </select>
                            </div>
                            <input type="hidden" class="form-control text-center" name="zone" id="zone" value="0"/>

                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-check-label" for="division">Select Division*</label>
                                <select class="form-select" name="division" id="division" required="">

                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="hallName">Hall Name:*</label> <input type="text" class="form-control"
                                                                                 id="hallName" name="hallName"
                                                                                 placeholder="Hall Name" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="hallArea">Hall Area (in square feet):*</label> <input type="text"
                                                                                                  class="form-control"
                                                                                                  id="hallArea"
                                                                                                  name="hallArea"
                                                                                                  placeholder="Hall Area"
                                                                                                  pattern="\d*"
                                                                                                  inputmode="numeric"
                                                                                                  oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                                                                                                  required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="doorNo">Door No:*</label>
                                <input type="text" class="form-control" id="doorNo" name="doorNo" pattern="\d*"
                                       inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                                       placeholder="Door No" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="street">Street:*</label> <input type="text" class="form-control"
                                                                            id="street" name="street"
                                                                            placeholder="Street" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="area">Area:*</label> <input type="text" class="form-control" id="area"
                                                                        name="area" placeholder="Area" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="city">City:*</label>
                                <input type="text" class="form-control" id="city" name="city" placeholder="City"
                                       required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="pinCode">Pincode:*</label>
                                <input type="text" class="form-control" id="pinCode" name="pinCode"
                                       placeholder="Pincode" required minlength="6" maxlength="6" pattern="[0-9]{6}"
                                       onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="hallInchargeName">Caretaker Name:*</label>
                                <input type="text" class="form-control" id="hallInchargeName"
                                       name="hallInchargeName" placeholder="Caretaker Name" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="hallInchargeNo">Caretaker Number:*</label>
                                <input type="text" class="form-control" id="hallInchargeNo" name="hallInchargeNo"
                                       placeholder="Caretaker Number" minlength="10" maxlength="10" pattern="[0-9]{10}"
                                       onkeypress="return event.charCode >= 48 && event.charCode <= 57" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="landmark">Landmark:*</label>
                                <input type="text" class="form-control" id="landMark" name="landMark"
                                       placeholder="Landmark" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="latitude">Latitude:*</label>
                                <input type="text" class="form-control" id="latitude" name="latitude"
                                       placeholder="Latitude" pattern="\d*" inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9.\-]/g,'').replace(/(\..*)\./g,'$1');"
                                       required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="longitude">Longitude:*</label>
                                <input type="text" class="form-control" id="longitude" name="longitude"
                                       placeholder="Longitude" pattern="\d*" inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9.\-]/g,'').replace(/(\..*)\./g,'$1');"
                                       required>
                            </div>
                        </div>
                        <div class="col-md-4">

    $(document).on('change', '.hall-image', function () {

    function validateFile(fileInput) {
        const allowedExtensions = /(\.jpg|\.jpeg|\.pdf)$/i;
        const file = fileInput.files[0];
        const filePath = fileInput.value;
        let errorMessage = '';

        // Validate file type
        if (!allowedExtensions.exec(filePath)) {
            errorMessage = 'Only JPG, JPEG, and PDF files are allowed.';
            fileInput.value = ''; // Clear the file input
            displayError(fileInput, errorMessage);
        } else {
            // If the file type is valid, clear any previous error message
            clearError(fileInput);

            // Handle image files separately
            if (/(\.jpg|\.jpeg)$/i.test(filePath) && file.size > 2097152) {
                compressImage(file).then(compressedFile => {
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(compressedFile);
                    fileInput.files = dataTransfer.files;

                    // Validate file size after compression
                    validateFileSize(fileInput);
                }).catch(error => {
                    errorMessage = 'Error compressing image.';
                    displayError(fileInput, errorMessage);
                });
            } else if (/(\.pdf)$/i.test(filePath) && file.size > 2097152) {
                errorMessage = 'PDF file size exceeds the 2MB limit.';
                fileInput.value = ''; // Clear the file input
                displayError(fileInput, errorMessage);
            } else {
                // console.log('File size is within limit:', file.size, 'bytes');
            }
        }
    }


    // Function to clear error messages
    function clearError(fileInput) {
        const errorContainer = fileInput.nextElementSibling;
        if (errorContainer && errorContainer.classList.contains('fileerror-message')) {
            errorContainer.style.display = 'none';
            errorContainer.textContent = ''; // Clear the error message text
        }
    }

    // Function to compress image using canvas
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxSize = 2097152; // 2MB in bytes
                    let scale = 1;
                    if (file.size > maxSize) {
                        scale = Math.sqrt(maxSize / file.size);
                    }
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // Convert canvas content to blob
                    canvas.toBlob(blob => {
                        resolve(new File([blob], file.name, {type: 'image/jpeg', lastModified: Date.now()}));
                    }, 'image/jpeg', 0.7); // Adjust JPEG quality as needed (0.7 is 70% quality)
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // Function to validate file size after compression
    function validateFileSize(fileInput) {
        const file = fileInput.files[0];
        if (file && file.size > 2097152) {
            //console.log('File size is still greater than 2MB after compression.');
            // Handle the situation where the file size is still greater than 2MB
            displayError(fileInput, 'File size is still greater than 2MB after compression.');
            fileInput.value = ''; // Clear the file input
        } else {
            //console.log('File size is within limit after compression.');
            // Handle the situation where the file size is within the limit
        }
    }

    // Function to display error messages
    // Function to display error messages
    function displayError(fileInput, errorMessage) {
        let errorContainer = fileInput.nextElementSibling;
        if (!errorContainer || !errorContainer.classList.contains('fileerror-message')) {
            errorContainer = document.createElement('div');
            errorContainer.classList.add('fileerror-message');
            fileInput.parentNode.insertBefore(errorContainer, fileInput.nextSibling);
        }
        errorContainer.textContent = errorMessage;
        errorContainer.style.display = 'block'; // Ensure the error message is visible
    }

            url: '/victoriahallbooking_uat/admin/api/updateHallImage/' + hallImageId,

    function saveHallImages() {
        var formData = new FormData();
        var fileInputs = $('#hallImageEditForm').find('input[type="file"]');

        // Append hallId to formData
        var hallId = $('#hallId').val();

        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Hall ID is missing.',
            });
            return;
        }

        // Iterate over all file inputs
        fileInputs.each(function () {
            if (this.files.length > 0) {
                // Add non-empty files to FormData
                for (var i = 0; i < this.files.length; i++) {
                    formData.append(this.name, this.files[i]);
                }
                hasValidFile = true;
            }
        });

        if (!hasValidFile) {
            Swal.fire({
                icon: 'warning',
                title: 'No Images Selected',
                text: 'Please upload at least one new image.',
            });
            return;
        }

        $.ajax({
            type: "POST",
            url: '/victoriahallbooking_uat/admin/api/savenewHallImages',

            contentType: false,
            processData: false,
            success: function (response) {

        formData.append("doorNo", doorNo);
        formData.append("street", street);
        formData.append("pinCode", pinCode);
        formData.append("area", area);
        formData.append("hallInchargeMobno", hallInchargeMobno);
        formData.append("hallInchargeName", hallInchargeName);
        formData.append("landMark", landMark);
        formData.append("latitude", latitude);
        formData.append("longitude", longitude);
        formData.append("depositAmount", parseFloat(depositamount));
        formData.append("halfDepositAmount", parseFloat(halfDepositamount));
        formData.append("fullDayRent", parseFloat(fullday));
        formData.append("halfDayRent", parseFloat(halfday));
        formData.append("parkingCapacity", parkingCapacity);
        formData.append("seatingCapacity", parseInt(seatingCapacity));
        formData.append("ebNumber", ebNumber);
        formData.append("ebCostPerUnit", ebCostPerUnit);
        formData.append("city", city);
        formData.append("gst", gst);
        formData.append("isActive", isActive);

        $.ajax({

            type: "POST",
            url: '/victoriahallbooking_uat/admin/api/updateHallDetails',
            contentType: false,
            processData: false,
            data: formData,
            dataType: 'text',
            success: function (bodyMessage) {


                if (bodyMessage.trim() == "Success") {
                    Swal.fire(
                        'Success!',
                        'Successfully updated.',
                        'success'
                    ).then(() => {
                        location.reload();
                    });
                } else {
                    Swal.fire(
                        'Error!',
                        'An error occurred while updating hall details.',
                        'error'
                    );
                }
            },
            error: function () {
                Swal.fire(
                    'Error!',
                    'An error occurred while updating hall details.',
                    'error'
                );
            }
        });

        return false;
    }

    $(document).ready(function () {


        // Add photo input
        $('#addPhoto').click(function () {
            var lastPhotoInput = $('#photoInputs').children().last();
            var newPhotoInput = lastPhotoInput.clone();
            var photoCount = $('#photoInputs').children().length + 1;

            // Clear the value of the cloned input field
            newPhotoInput.find('.hall-image').val('');

            newPhotoInput.find('.hall-image').attr('id', 'photo' + photoCount);
            newPhotoInput.find('label').attr('for', 'photo' + photoCount).text('Photo ' + photoCount + ':');

            // Check if delete button already exists before appending
            if (!newPhotoInput.find('.delete-photo').length) {
                newPhotoInput.append('<div class="input-group-append"><button type="button" class="btn btn-danger delete-photo"><i class="fas fa-trash"></i></button></div>');
            }
            $('#photoInputs').append(newPhotoInput);
        });

        // Delete photo input
        $(document).on('click', '.delete-photo', function () {
            $(this).closest('.col-md-3').remove();
            // Update photo labels after deletion
            $('#photoInputs .col-md-3').each(function (index) {
                $(this).find('label').text('Photo ' + (index + 1) + ':');
                $(this).find('.hall-image').attr('id', 'photo' + (index + 1));
            });
        });

    });

    function viewHallImages(hallId) {
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/admin/api/getImageById',
            data: {
                'hallId': hallId
            },
            success: function (res) {
                if (res && res.length > 0) {
                    getHallImagesById(res);
                } else {
                    console.error('No images found for hallId:', hallId);
                }
            },
            error: function (xhr, status, error) {
                console.error('Error fetching images:', error);
            }
        });
    }

    function getHallImagesById(images) {
        const modalSlidesContainer = document.querySelector('.carousel-inner');
        modalSlidesContainer.innerHTML = ''; // Clear existing slides

        images.forEach((image, index) => {
            const slide = document.createElement('div');
            slide.classList.add('carousel-item');
            if (index === 0) {
                slide.classList.add('active');
            }
            const img = document.createElement('img');
            img.src = image.hallImage;
            // img.alt = Slide ${image.hallImageId};
            img.alt = `Slide ${image.hallImageId}`;
            img.style.maxHeight = '550px'; // Adjust image size
            img.style.width = 'auto'; // Maintain aspect ratio
            slide.appendChild(img);
            modalSlidesContainer.appendChild(slide);
        });

        $('#exampleModal').modal('show'); // Show Bootstrap modal
    }

    function submitForm() {
        var selectedZone = document.getElementById("zone1");
        var selectedZoneValue = selectedZone.value;

        // Check if a zone is selected
        if (selectedZoneValue === "" || selectedZoneValue === "---Select Zone---") {
            selectedZone.setCustomValidity("Please select a zone.");
            selectedZone.reportValidity();
            return false; // Prevent form submission
        } else {
            selectedZone.setCustomValidity(""); // Clear any previous error message
        }

        // Set the hidden zone field value
        document.getElementById("zone").value = selectedZone.options[selectedZone.selectedIndex].innerHTML;

        // Form is valid, allow submission
        return true;
    }

    function fieldsreset() {
        // Select the form element
        var form = document.getElementById('hallform');

        // Check if form exists
        if (form) {
            // Clear all input fields
            $(form).find('input').val('');
            $(form).find('textarea').val('');
            $(form).find('select').prop('selectedIndex', 0);

            // Remove any dynamically added error messages and classes
            $('.error-message').remove();
            $('.file-upload-field').removeClass('error');

            // Remove any dynamically added photo inputs
            $('#photoInputs .hall-image').not(':first').parent().parent().remove();
