	function paymentStart(counterUserId, counterBookingId, counterOption) {

		} else {
			if (this.userId == 0) {
				alert("Please Login & Retry");
				return false;
			}
			if (this.bookingId == 0) {
				alert("Please try retry booking");
				return false;
			}
		}

    function openPayment(key_id, amount,customerName,customerEmail,customerPhone,order_id,description,callbackUrl,ref_id) {

        var form = document.createElement("form");
        form.setAttribute("action", "https://api.razorpay.com/v1/checkout/embedded");

        form.setAttribute("method", "POST");

        var hiddenField = document.createElement("input");
        hiddenField.setAttribute("type","hidden");
        hiddenField.setAttribute("name",  "key_id");
        hiddenField.setAttribute("id",  "key_id");
        hiddenField.setAttribute("value", key_id);
        form.appendChild(hiddenField);

        var hiddenField2 = document.createElement("input");
        hiddenField2.setAttribute("type","hidden");
        hiddenField2.setAttribute("name",  "amount");
        hiddenField2.setAttribute("id",  "amount");
        hiddenField2.setAttribute("value", amount);
        form.appendChild(hiddenField2);


        var hiddenField3 = document.createElement("input");
        hiddenField3.setAttribute("type","hidden");
        hiddenField3.setAttribute("name",  "name");
        hiddenField3.setAttribute("id",  "name");
        hiddenField3.setAttribute("value", customerName );
        form.appendChild(hiddenField3);

        var hiddenField4 = document.createElement("input");
        hiddenField4.setAttribute("type","hidden");
        hiddenField4.setAttribute("name",  "prefill[email]");
        hiddenField4.setAttribute("id",  "email");
        hiddenField4.setAttribute("value", customerEmail );
        form.appendChild(hiddenField4);

        var hiddenField5 = document.createElement("input");
        hiddenField5.setAttribute("type","hidden");
        hiddenField5.setAttribute("name",  "prefill[contact]");
        hiddenField5.setAttribute("id",  "contact");
        hiddenField5.setAttribute("value", customerPhone );
        form.appendChild(hiddenField5);

        var hiddenField6 = document.createElement("input");
        hiddenField6.setAttribute("type","hidden");
        hiddenField6.setAttribute("name",  "order_id");
        hiddenField6.setAttribute("id",  "order_id");
        hiddenField6.setAttribute("value", order_id );
        form.appendChild(hiddenField6);


        var hiddenField7 = document.createElement("input");
        hiddenField7.setAttribute("type","hidden");
        hiddenField7.setAttribute("name",  "description");
        hiddenField7.setAttribute("id",  "description");
        hiddenField7.setAttribute("value", description );
        form.appendChild(hiddenField7);


        var hiddenField8 = document.createElement("input");
        hiddenField8.setAttribute("type","hidden");
        hiddenField8.setAttribute("name",  "callback_url");
        hiddenField8.setAttribute("id",  "callback_url");
        hiddenField8.setAttribute("value", callbackUrl );
        form.appendChild(hiddenField8);

        var hiddenField9 = document.createElement("input");
        hiddenField9.setAttribute("type","hidden");
        hiddenField9.setAttribute("name",  "notes[transaction_id]");
        hiddenField9.setAttribute("id",  "transaction_id");
        hiddenField9.setAttribute("value", ref_id );
        form.appendChild(hiddenField9);



        //  form.setAttribute("target", "_blank");

        document.body.appendChild(form);
        form.submit();

    }

	
	
	function extrapaymentStart(userId, bookingId) {
		if (this.userId != 0 && this.bookingId != 0) {
			var userIdd = userId;
			var bookingIdd = bookingId;
			//console.log("userIdd:-" + userIdd);
			//console.log("bookingIdd:-" + bookingIdd);
			$.ajax({
				type: "POST",
				url: '/victoriahallbooking_uat/payment/api/additionaldamage-payment-request',
				data: {'userId': userIdd, 'bookingId': bookingIdd},
				success: function (response) {
					// console.log(response);
					if (response.error) {
						alert("please Contact Admin..")
					} else {

						txansactionId = response.txansactionId;
						consumerMobileNo = response.consumerMobileNo;
						consumerEmailId = response.consumerEmailId;
						token = response.token;
						merchantId = response.merchantId;
						consumerId = response.consumerId;
						amount = response.amount;
						//console.log(txansactionId);
						//console.log(consumerMobileNo);
						//console.log(token);
						//console.log(merchantId);
						//console.log(consumerId);
						//console.log(amount);
						$("#extrapaymentbtnSubmit").click();

					}
				},
				error: function () {
					//console.log("Error");// Handle error here
				}
			});
		}
		else {
			alert("please logout & retry")
		}
		return false;
	}
