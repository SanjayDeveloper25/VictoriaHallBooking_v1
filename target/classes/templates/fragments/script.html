<script>
	$(document).ready(function () {
		// Get the current URL
		var currentUrl = window.location.href;

		// Loop through each navigation item
		$('.nav-main-item').each(function () {
			// Get the link for this item
			var link = $(this).find('.nav-main-link').attr('href');
			// Check if the link matches the current URL
			if (currentUrl.indexOf(link) !== -1) {
				// Add the active class to this item
				$(this).find('.nav-main-link').addClass('active');

				// Add the open class to the parent item
				$(this).parents('.nav-main-item').addClass('open');
			}
		});

	});

	function resetPassword() {
		$('#resetpinForm').modal('show');
		}
		function resetpinsave() {
    let resetpinmobilenumber = $("#resetpinmobilenumber").val();
    let oldpin = $("#oldpin").val();
    let newpin = $("#newpin").val();
    
    // Validate that all fields are filled
    if (!resetpinmobilenumber || !oldpin || !newpin) {
        Swal.fire('Error', 'Please fill all the fields.', 'error');
        return false; // Prevent form submission
    }

    $.ajax({
        type: "GET",
        url: '/victoriahallbooking_uat/careTaker/api/resetPIN',
        data: {
            'oldpin': oldpin,
            'newpin': newpin,
            'resetpinmobilenumber': resetpinmobilenumber
        },
        dataType: 'text',
        success: function(bodyMessage) {
            if (bodyMessage.trim() === "Success") {
                Swal.fire(
                    'PIN Registration!',
                    'Your New PIN Successfully Saved!<br>Now login with your new PIN.',
                    'success'
                ).then(() => {
                     window.location.href = '/victoriahallbooking_uat/admin/logout';
                });
            } else if (bodyMessage.trim() === "error") {
                Swal.fire(
                    'Error',
                    'Old PIN is not matched with your password',
                    'error'
                )
            }
        },
        error: function() {
            Swal.fire(
                'Error',
                'An error occurred while processing your request. Please try again later.',
                'error'
            );
        }
    });

    return false; // Prevent form submission as the form is handled by AJAX
}
document.addEventListener('DOMContentLoaded', function () {
				    function clearModalFields(modalId) {
				        const modal = document.getElementById(modalId);
				        if (modal) {
				            // Clear text inputs and select elements
				            modal.querySelectorAll('input[type="password"], select').forEach(input => {
				                if (input.tagName === 'SELECT') {
				                    input.selectedIndex = 0; // Reset to default option
				                } else {
				                    input.value = ''; // Clear text inputs
				                }
				            });
				        }
				    }
				
				    // Clear fields when the saveModal is hidden
				    document.getElementById('resetpinForm').addEventListener('hidden.bs.modal', function () {
				        clearModalFields('resetpinForm');
				    });
				});
</script>
