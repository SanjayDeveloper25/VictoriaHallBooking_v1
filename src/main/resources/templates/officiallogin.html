<script th:replace="~{fragments/loginscript :: script}"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<script>
    function sendOTP() {
        document.getElementById("error").style.display = "none";
        //alert($('#mobii').val());
        var mobileNo = $('#mobii').val();
        var pin = $('#password').val();
        if (mobileNo.length != 10) {
            alert("Please Enter Mobile Number");
            return false;
        }

        if (pin.trim() == '' || pin.length == 0) {
            alert("Please Enter Password ");
            return false;
        }
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/user/api/sendOTP',
            data: {'mobileNo': mobileNo, 'purpose': 'Officer Login'},
            success: function (bodyMessage) {
                document.getElementById("otpInput").style.display = "block";
                document.getElementById("sendBtn").style.display = "none";
                document.getElementById("verifyBtn").style.display = "block";
                document.getElementById("resend-container1").style.display = "block";

                // console.log(mobileNo);
                // Calculate the elapsed time since the request started
                var resendTimeout;
                // var resendLink = $("#resend-link1");
                $("#resend-link1").html('Please wait..<span id="countdown1">60</span>s');
                var countdown = $("#countdown1");

                // Function to start the countdown timer
                function startCountdown2() {
                    var timeleft = 60;
                    countdown.text(timeleft);

                    resendTimeout = setInterval(function () {
                        timeleft--;
                        countdown.text(timeleft);

                        if (timeleft <= 0) {
                            clearInterval(resendTimeout);
                            $("#resendlink1").html('<a href="#" id="resend-link1" class="text-info" onclick="return sendOTP(' + mobileNo + ');">Resend OTP</a>');
                        }
                    }, 1000);
                }

                startCountdown2(); // Start Resend OTP count
            },
            error: function () {
                // Handle error case if the AJAX request fails
                let elapsedTime = new Date().getTime() - startTime;
                let delay = Math.max(0, minDisplayTime - elapsedTime);

                setTimeout(function () {
                    Swal.close(); // Close the Swal loading dialog
                    // Show network error Swal
                    Swal.fire(
                        'Network Error!',
                        'Please try again later.',
                        'error'
                    );
                }, delay); // Delay closing the loading dialog before showing the error
            }
        });

        return false;
    }

    function verifyOTP() {
        // Get all the input fields with class `otp-input`
        var otpInputs = $('#loginOTP').val();
        var mobileNo = $('#mobii').val();

        if (mobileNo.length != 10) {
            alert("Please Enter Mobile Number");
            return false;
        }

        //alert(otpInputs);
        if (otpInputs.trim() == '') {
            alert("Please Enter OTP ");
            return false;
        }
        if (otpInputs.length != 5) {
            alert("Please Enter Correct OTP");
            return false;
        }

        //document.getElementById("saveFeedbackForm").submit();
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/user/api/verifyofficialOTP',
            data: {'otp': otpInputs, 'mobileNo': mobileNo},
            dataType: 'text',
            success: function (bodyMessage) {
                //alert(bodyMessage);
                if (bodyMessage.trim() == "Success") {
                    // console.log("OTP is Verified!!!");
                    document.getElementById("loginBtn").style.display = "block";
                    document.getElementById("verifyBtn").style.display = "none";
                    document.getElementById("otpInput").style.display = "none";
                    document.getElementById("resend-container1").style.display = "none";

                    Swal.fire({
                        title: 'Login OTP',
                        text: ' OTP is Verified!!',
                        icon: 'success',
                        confirmButtonText: 'OK'
                    }).then((result) => {
                        login(2);
                    });

                    return false;
                    // callSave();
                } else {
                    Swal.fire({
                        title: 'OTP',
                        text: 'Entered OTP is Incorrect!!',
                        icon: 'warning',
                        confirmButtonText: 'OK'
                    }).then((result) => {
                        $("#loginOTP").val('');
                    });
                }
            },
            error: function () {
                // console.log("Error");// Handle error here
                return false;
            }
        });

        return false;
    }

    function login(flag) {
        document.getElementById("resend-container1").style.display = "none";
        var mobileNo = $("#mobii").val();
        var pin = $("#password").val();
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/careTaker/api/checkLogin',
            data: {mobileNo: mobileNo, pin: pin},
        }).done(function (response) {
            // Store token in localStorage or sessionStorage for subsequent requests
            localStorage.setItem('jwtToken', response);
            if (response == "error") {
                $("#error").html("<p class='text-danger'>Invalid PIN or Mobile Number!<br>If you are a new user, please register as a new user.</p>");
                $("#mobii").val("");
                $("#password").val("");
            } else {
                if (flag == 1) {
                    sendOTP();
                }
                if (flag == 2) {
                    redirectToDashboard(response);
                }
            }
        }).fail(function (jqXHR, textStatus, errorThrown) {
            // Log the error and any relevant information
            if (jqXHR.status === 400) {
                // Handle 400 Bad Request Error
                $("#error").html("<p class='text-danger'>" + jqXHR.responseText + "</p>");
            } else if (jqXHR.status === 417) {
                // Handle 417 Expectation Failed Error
                $("#error").html("<p class='text-danger'>" + jqXHR.responseText + "</p>");
            } else {
                // Handle other errors
                console.error(jqXHR);
            }
        });
        return false;
    }

    function redirectToDashboard(userType) {
        switch (userType) {
            case "caretaker":
                window.location.href = "/victoriahallbooking_uat/caretaker/dashboard";
                break;
            case "officer":
                window.location.href = "/victoriahallbooking_uat/officer/officer-dashboard";
                break;
            case "admin":
                window.location.href = "/victoriahallbooking_uat/admin/dashboard";
                break;
            case "pensioner":
                window.location.href = "/victoriahallbooking_uat/departments/pensionerdashboard";
                break;
            case "councillor":
                window.location.href = "/victoriahallbooking_uat/departments/counsellordashboard";
                break;
            case "gccstaff":
                window.location.href = "/victoriahallbooking_uat/departments/gccstaffdashboard";
                break;
            case "counter":
                // window.location.href = "/communityhall/counter/counterbooking";
                window.location.href = "/victoriahallbooking_uat/user/dashboard";
                break;
            case "headquarters":
                window.location.href = "/victoriahallbooking_uat/headquarters/dashboard";
                break;
            default:
                console.error("Invalid user type:", userType);
        }
    }

    $('.otp-input').on('keyup', function (e) {
        var $this = $(this);
        if ($this.val().length === 1) {
            $this.next('.otp-input').focus();
        }
        if ($this.val().length === 0) {
            $this.prev('.otp-input').focus();
        }
    });

    function newPinCall() {
        $('#loginForm').modal({
            backdrop: 'static',
            keyboard: false
        });
        $('#otpForm').modal({
            backdrop: 'static',
            keyboard: false
        });
        $('#pinForm').modal({
            backdrop: 'static',
            keyboard: false
        });
        $("#mobii").val('');
        $("#password").val('');
        $("#loginOTP").val('');
        $('#otpForm').modal('hide');
        $('#pinForm').modal('show');
        return false;
    }

    var password = document.getElementById("password"),
        confirm_password = document.getElementById("confirm_password");

    function validatePassword() {
        if (password.value != confirm_password.value) {
            confirm_password.setCustomValidity("PIN doesn't match");
        } else {
            confirm_password.setCustomValidity('');
        }
    }

    function checkofficialMobileNo(flag) {
        if (flag == 1) {
            var mobileNo = $("#mobii").val();
            if (mobileNo.trim() == '' || mobileNo.length == 0) {
                alert("Please Enter Mobile No ");
            }
        }
        if (flag == 2) {
            var pincode = $("#pincode").val('');
            var mobileNo = $("#officialmobileno").val();
            if (mobileNo.trim() == '' || mobileNo.length == 0) {
                alert("Please Enter Mobile No ");
            }
        }

        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/careTaker/api/checkofficialMobileExits',
            data: {'phone': mobileNo},
            //dataType: 'json',
            success: function (bodyMessage) {
                //alert(bodyMessage);
                if (bodyMessage == "success") {
                    if (flag == 1) {
                        login(1);
                    }
                    if (flag == 2) {
                        sendOTP2(mobileNo);
                    }
                    return false;
                } else {
                    alert("This Mobile Number Is Not Registered!");
                    return false;
                }
            },
            error: function (errortxt) {
                console.error(errortxt);// Handle error here
                return false;
            }
        });
        return false;
    }

    function sendOTP2(mobileNo) {
        // var mobileNo = $("#mobii").val();

        //alert("Sending OTP please Verify :- "+mobileNo);
        $("#mobilenotxt").html(mobileNo);

        // console.log(mobileNo + "Send OTP2");
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/user/api/sendOTP',
            data: {'mobileNo': mobileNo, 'purpose': 'Forget Pin'},
            dataType: 'json',
            success: function (bodyMessage) {
                // console.log("bodyMessage....." + bodyMessage);
                if (bodyMessage != "Error") {
                    $('#otpForm').modal({
                        backdrop: 'static',
                        keyboard: false
                    });
                    $('#otpForm').modal('show');
                    // Resend OTP Link function /////////////////////
                    var resendTimeout;
                    var resendLink = $("#resend-link");
                    $("#resend-link").html('Please wait..<span id="countdown">60</span>s');
                    var countdown = $("#countdown");

                    // Function to start the countdown timer
                    function startCountdown2() {
                        var timeleft = 60;
                        countdown.text(timeleft);

                        resendTimeout = setInterval(function () {
                            timeleft--;
                            countdown.text(timeleft);

                            if (timeleft <= 0) {
                                clearInterval(resendTimeout);
                                $("#resendlink").html('<a href="#" id="resend-link" class="text-info" onclick="return sendOTP2(' + mobileNo + ');">Resend OTP</a>');
                            }
                        }, 1000);
                    }

                    startCountdown2(); // Start Resend OTP count
                    /////////////////////////////////////////////////
                } else {
                    alert("OTP Not Send!!!");
                }
            }
        });
        return false;

    }

    function verifyOtp2() {
        // Get all the input fields with class `otp-input`
        var otpInputs = $('.otp-input');

        // Get the OTP value as a string
        var otpValue = '';
        otpInputs.each(function () {
            otpValue += $(this).val();
        });

        //document.getElementById("saveFeedbackForm").submit();
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/user/api/verifyofficialOTP',
            data: {'otp': otpValue},
            dataType: 'text',
            success: function (bodyMessage) {
                if (bodyMessage.trim() == "Success") {
                    // console.log("OTP is Verified!!!");
                    callSave();
                } else {
                    $("#otperror").html("OTP is Incorrect!!!");
                    // do something here
                }
            },
            error: function () {
                // console.log("Error");// Handle error here
            }
        });

        return false;
    }


    function callSave() {
        phone = $("#officialmobileno").val();
        pin = $("#updatedpassword").val();
        $.ajax({
            type: "GET",
            url: '/victoriahallbooking_uat/careTaker/api/updatePIN',
            data: {
                'phone': phone,
                'pin': pin
            },
            dataType: 'text',
            success: function (bodyMessage) {
                if (bodyMessage.trim() == "Success") {
                    Swal.fire(
                        'PIN Registration!',
                        'Your New PIN Successfully Saved!<br>Now login with your new PIN.',
                        'success'
                    ).then(() => {
                        location.reload();
                    });
                } else {
                    $("#otperror").html("Error on saving new pin!.Please try again!.<br>or Already Mobile Number exits.");
                }
            },
            error: function () {
                // console.log("Error");// Handle error here
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        function clearModalFields(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                // Clear text inputs and select elements
                modal.querySelectorAll('input[type="text"], input[type="password"], select').forEach(input => {
                    if (input.tagName === 'SELECT') {
                        input.selectedIndex = 0; // Reset to default option
                    } else {
                        input.value = ''; // Clear text inputs
                    }
                });
            }
        }

        // Clear fields when the saveModal is hidden
        document.getElementById('pinForm').addEventListener('hidden.bs.modal', function () {
            clearModalFields('pinForm');
        });
    });

    $('#otpForm').on('shown.bs.modal', function () {
        $('.otp-input').val('');
        $('#otperror').text('');
        // $('#mobilenotxt').text('');
