    .required-field {
        color: red;
    }

    .error {
        border: 1px solid red;
    }

    .error-message {
        color: red;
        font-size: 12px;
        padding-top: 5px;
    }

    .form-control[readonly] {
        background-color: white;
    }

    .swal2-container {
        z-index: 9999999999999 !important;
        /* Adjust this value if needed */
    }

    .form-check-label {
        padding-left: 0px
    }

<div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Login or Register</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hid den="true" style="color:black">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Nav tabs -->
                <ul class="nav nav-tabs" id="loginTabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="login-tab" data-toggle="tab" href="#login" role="tab"
                           aria-controls="login" aria-selected="true">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="register-tab" data-toggle="tab" href="#register" role="tab"
                           aria-controls="register" aria-selected="false">Register</a>
                    </li>
                </ul>
                <!-- Tab panes -->
                <div class="tab-content mt-3" id="loginTabContent">
                    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                        <!-- Login Form -->
                        <form>
                            <div class="form-group">
                                <label for="mobileNumber" style="margin-right:29%">Mobile Number<span
                                        class="required-field">*</span></label>
                                <input type="tel" class="form-control custom-input" id="mobileNumber"
                                       name="mobileNumber" minlength="10" maxlength="10" pattern="[0-9]{10}"
                                       placeholder="Enter your mobile number" style="width: 49%;margin-left: 28%;"
                                       required
                                       onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                            </div>

                            <div class="form-group text-center">
                                <button type="button" class="btn btn-info" id="sendOTPButton">Send OTP</button>
                                <button type="button" class="btn btn-danger" id="signUpButton"
                                        onclick="redirectToSignUp()">Sign Up
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                        <!-- Register Form -->
                        <form action="/victoriahallbooking_uat/user/newregistrationform" id="newform" method="post"
                              name="newform"
                              onsubmit="return validateUserType();" enctype="multipart/form-data">
                            <!-- Row 1 with Name, Father Name, and Mobile No -->
                            <div class="row">
                                <div class="col-sm-4" style="margin-left:0%">
                                    <div class="form-group">

                                        <label for="userType">User Type:<span
                                                class="required-field">*</span></label>
                                        <select class="form-control" id="userType" name="usertype"
                                                placeholder="User Type" required>
                                            <option value="">Select</option>
                                            <option value="PUBLIC">General Public</option>
                                            <!-- <option value="PENSIONER">GCC Pensioner</option>
                                            <option value="COUNCILLOR">Councillor</option>
                                            <option value="GCC_EMPLOYEE">GCC Employee</option> -->
                                        </select>
                                    </div>
                                </div>
                                <input type="hidden" class="form-control" id="governmentId" name="governmentId">
                                <input type="hidden" class="form-control" id="department" name="department">
                                <div class="hidden" id="employeeFields">
                                    <div class="row">
                                        <div class="col-sm-4">
                                            <div class="form-group">

                                                <label for="employeeId">Employee ID<span
                                                        class="required">*</span>:</label>
                                                <input type="text" class="form-control" id="employeeId"
                                                       name="employeeId" placeholder="Employee ID">
                                            </div>
                                        </div>
                                        <div class="col-sm-4">
                                            <div class="form-group">

                                                <label for="employeedepartment">Employee Department<span
                                                        class="required">*</span>:</label>
                                                <input type="text" class="form-control" id="employeedepartment"
                                                       name="employeedepartment"
                                                       placeholder="Employee Department "
                                                       style="background-color: white;" readonly>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="hidden" id="pensionerFields">
                                    <div class="row">
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label for="pensionerId">Pensioner ID<span
                                                        class="required">*</span>:</label>
                                                <input type="text" class="form-control" id="pensionerId"
                                                       name="pensionerId" placeholder="Pensioner ID">
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label for="department">Department:</label>
                                                <input type="text" class="form-control" id="pendionerdepartment"
                                                       name="pendionerdepartment" placeholder="Department"
                                                       style="background-color: white;" readonly>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="validationResult"></div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="name">Name:<span class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="First Name" required>
                                    </div>
                                    <small id="emailHelp" class="form-text text-muted"></small>
                                </div>

                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="mobileno">Mobile Number:<span
                                                class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="mobileno" name="mobileNo"
                                               placeholder="Mobile No" minlength="10" maxlength="10"
                                               pattern="[0-9]{10}"
                                               onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                                               required>
                                    </div>
                                </div>

                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="mobileno">Aadhar Number:<span
                                                class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="aadharnumber"
                                               name="aadharnumber"
                                               placeholder="Aadhar No" minlength="12" maxlength="12"
                                               pattern="[0-9]{12}"
                                               onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                                               required>
                                    </div>
                                </div>
                            </div>
                            <!-- Row 2 with Email, Door No, and Street -->
                            <div class="row">

                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="userPhoto">Profile Photo:</label>
                                        <input type="file" class="form-control profile-file-upload"
                                               id="userPhoto" name="userPhoto"
                                               accept="image/jpeg, image/png, image/gif">
                                    </div>
                                </div>

                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="email">E-Mail ID:</label>
                                        <input type="email" class="form-control" id="email" name="email"
                                               placeholder="E-Mail ID" maxlength="255">
                                    </div>
                                    <small id="emailHelps" class="form-text text-muted"></small>
                                </div>
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="doorNo">Door No:<span
                                                class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="doorNo" name="doorNo"
                                               placeholder="Door No" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">

                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="street">Street:<span class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="street" name="street"
                                               placeholder="Street" required>
                                    </div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="area">Area:<span class="required-field">*</span></label>
                                        <input type="area" class="form-control" id="area" name="area"
                                               placeholder="Area"
                                               required>
                                    </div>
                                    <small id="emailHelped" class="form-text text-muted"></small>
                                </div>
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="location">Location:<span
                                                class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="location" name="location"
                                               placeholder="Location" required>
                                    </div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label for="pincode">Pincode:<span
                                                class="required-field">*</span></label>
                                        <input type="text" class="form-control" id="pincode" name="pinCode"
                                               placeholder="Pincode" minlength="6" maxlength="6"
                                               pattern="[0-9]{6}"
                                               onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                                               required>
                                    </div>
                                </div>

                            </div>

                            <div class="form-row">
                                <div class="col text-center">
                                    <button type="submit" class="btn btn-primary"
                                            style="background-color: #2c726c !important">Submit
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="otpForm" tabindex="-1" role="dialog" aria-labelledby="otpFormLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form action="#" th:action="@{/otpForm}" th:object="${otpForm}" method="post"
                  onsubmit="return verifyOtp(); ">
                <div class="modal-header">
                    <h6 class="modal-title m-0" id="exampleModalDefaultLabel">OTP Login</h6>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close"
                            style="color:black;border: white;background-color: white;">
                        <span aria-hidden="true">&times;</span></button>
                </div><!--end modal-header-->
                <div class="modal-body">
                    <div class="row">
                        <div class="mb-3 text-center">
                            <img src="media/images/mobileotp.png" width="50%" alt="Mobileotp">
                        </div>
                        <div class="mb-0 text-center">
                            <h4>OTP Verification</h4>
                            <p class="text-mute">Enter the OTP sent to <b class="text-info"
                                                                          id="mobilenotxt"></b>
                            </p>
                            <p class="text-danger" id="otperror"></p>
                        </div>
                        <div class="mb-3 text-center">
                            <div class="otp-input-box">
                                <input type="text" maxlength="1" class="otp-input" id="otp1" required/>
                                <input type="text" maxlength="1" class="otp-input" id="otp2" required/>
                                <input type="text" maxlength="1" class="otp-input" id="otp3" required/>
                                <input type="text" maxlength="1" class="otp-input" id="otp4" required/>
                                <input type="text" maxlength="1" class="otp-input" id="otp5" required/>
                            </div>
                        </div>
                        <div class="mb-3 text-center">
                            <div id="resend-containers">
                                <p class="mb-0">Didn't receive OTP?</p>
                                <p class="mb-0 text-info" id="resendlink"></p>
                            </div>
                        </div>
                    </div><!--end row-->
                </div><!--end modal-body-->
                <div class="modal-footer">
                    <button type="button" class="btn btn-de-secondary btn-sm" data-bs-dismiss="modal">Close
                    </button>
                    <button type="submit" class="btn btn-primary btn-sm" id="but">Verify OTP</button>
                </div><!--end modal-footer-->
            </form>
        </div><!--end modal-content-->
    </div><!--end modal-dialog-->
</div>
<!--profile popup-->
<!-- Modal -->
<div class="modal fade" id="profileModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background-color: rgb(21,69,93);">
                <h5 class="modal-title" id="exampleModalLabel" style="color: white;">Profile</h5>
                <button type="button" class="close" style="color: white;" data-bs-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4">
                        <div style="border-radius: 50%; overflow: hidden; width: 110px; height: 110px; margin: 0 auto;box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.75);">
                            <img id="p_image" name="p_image" style="width: 100%; height: 100%;" alt="-">
                        </div>
                        <input type="file" id="fileInput" style="display:none;">

                    </div>
                    <div class="col-sm-4"></div>
                </div>
                <div class="row">
                    <input type="hidden" class="form-control" id="p_userId">
                    <div class="col-sm-6">
                        <label for="p_name">Name:</label>
                        <input type="text" class="form-control" id="p_name" readonly>
                    </div>
                    <div class="col-sm-6">
                        <label for="p_email">E-Mail ID:</label>
                        <input type="mail" class="form-control" id="p_email" readonly maxlength="255"
                               oninput="validateEmail()">
                    </div>
                    <div class="col-sm-6">
                        <label for="p_mobnum">Mobile No:</label>
                        <input type="text" class="form-control" id="p_mobnum" readonly>
                    </div>
                    <div class="col-sm-6">
                        <label for="p_doornum">Door no:</label>
                        <input type="text" class="form-control" id="p_doornum" readonly>
                    </div>
                    <div class="col-sm-6">
                        <label for="p_area">Area:</label>
                        <input type="text" class="form-control" id="p_area" readonly>
                    </div>
                    <div class="col-sm-6">
                        <label for="p_location">Location:</label>
                        <input type="text" class="form-control" id="p_location" readonly>
                    </div>
                    <div class="col-sm-6">
                        <label for="p_pincode">Pincode:</label>
                        <input type="text" class="form-control" id="p_pincode" readonly minlength="6"
                               maxlength="6" pattern="[0-9]{6}"
                               onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                    <div class="col-sm-6">
                        <label for="p_userstatus">User Status:</label>
                        <input type="text" class="form-control" id="p_userstatus" readonly>
                    </div>
                    <div class="col-sm-6" id="rejectionReasonContainer" style="display:none;">
                        <label for="p_rejectionreason">Rejection Reason:</label>
                        <input type="text" class="form-control" id="p_rejectionreason" readonly>
                    </div>
                    <div class="col-sm-6" readonly>
                        <label for="p_usertype">User Type:</label>
                        <select id="p_usertype" class="form-control">
                            <option value="PUBLIC">General Public</option>
                            <!--<option value="FAMILYPENSIONER">Family Pensioner</option>-->
                            <option value="PENSIONER">GCC Pensioner</option>
                            <option value="COUNCILLOR">Councillor</option>
                            <option value="GCC_EMPLOYEE">Gcc Employee</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="updateButton" style="display:none;"
                        onclick="updateUserDetails();">Update
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade backdrop" id="resetpinForm" data-backdrop="static" tabindex="-1" role="dialog"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form action="#" onsubmit="return checkofficialMobileNo();">
                <div class="block block-rounded block-themed block-transparent mb-0">
                    <div class="block-header bg-primary-dark">
                        <h3 class="block-title" id="mtitl">Reset PIN Mobile NO<span
                                class="d-none d-sm-inline ms-1" th:text="${mobileno}"></span></h3>
                        <div class="block-options">
                            <button type="button" class="btn-block-option" data-bs-dismiss="modal"
                                    aria-label="Close">
                                <i class="fa fa-fw fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="block-content">
                        <div class="mb-4">
                            <label class="form-label">Mobile Number<span class="text-danger">*</span></label>
                            <input type="text" th:value="${mobileno}" class="form-control text-center"
                                   name="resetpinmobilenumber" id="resetpinmobilenumber"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Old Password<span class="text-danger">*</span></label>
                            <input type="text" maxlength="4" class="form-control text-center" name="oldpin"
                                   id="oldpin" placeholder="Numbers Only"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">New 4 Digit PIN <span class="text-danger">*</span></label>
                            <input type="password" maxlength="4" class="form-control text-center" name="newpin"
                                   id="newpin" placeholder="Numbers Only" required/>
                        </div>
                    </div>
                    <div class="block-content block-content-full text-end bg-body" id="mbutton">
                        <button type="button" class="btn btn-sm btn-alt-secondary" data-bs-dismiss="modal">
                            Close
                        </button>
                        <button type="submit" class="btn btn-sm btn-primary">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!--Conuter Login  Modal-->
<div class="modal fade" id="cloginModal" tabindex="-1" role="dialog" aria-labelledby="cloginModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cloginModalLabel">Counter Login</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hid den="true" style="color:black">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Nav tabs -->
                <ul class="nav nav-tabs" id="cloginTabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="clogin-tab" data-toggle="tab" href="#login" role="tab"
                           aria-controls="login" aria-selected="true">Login</a>
                    </li>
                </ul>
                <!-- Tab panes -->
                <div class="tab-content mt-3" id="cloginTabContent">
                    <div class="tab-pane fade show active" id="clogin" role="tabpanel" aria-labelledby="login-tab">
                        <!-- Login Form -->
                        <form class="form-inline">
                            <div class="form-group col-12 d-flex justify-content-center mt-2" >
                                <label for="cusername">UserName<span
                                        class="required-field">*</span></label>
                                <input type="text" class="form-control" id="cusername" placeholder="Enter username"
                                        style="width: 35% " required>
                            </div>
                            <div class="form-group col-12 d-flex justify-content-center mt-2" >
                                <label>Password<span
                                        class="required-field">*</span></label>
                                <input type="password" class="form-control" id="cpassword" placeholder="Enter Password"
                                       minlength="4" maxlength="4" style="width: 35%" required>
                            </div>

                            <div class="form-group col-12 d-flex justify-content-center mt-2">
                                <button type="button" class="btn btn-info" id="counterSubmit" onclick="verifyCounterLogin()">Submit</button>
                            </div>
                            <p class="text-uppercase fw-bold fs-sm text-muted col-12 " id="error"
                               th:utext="${errortxt}"></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
