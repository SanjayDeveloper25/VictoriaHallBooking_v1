	<!-- Login Modal-->
	<!--<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>-->
	<!--<script src="https://cdn.jsdelivr.net/npm/leaflet/dist/leaflet.js"></script>-->
	<script type="text/javascript" src="js\leaflet.js"></script>
	<div th:replace="~{fragments/loginreg :: div}"></div>
	<script th:replace="~{fragments/script :: script}"></script>
	<script th:replace="~{fragments/logRegiOtpScript :: script}"></script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const termsLink = document.getElementById("termsLink");
			const listLink = document.getElementById("listLink");
			const termsContent = document.getElementById("termsContent");
			const listContent = document.getElementById("listContent");
			const listmap = document.getElementById("maplink");
			const mapcontent = document.getElementById("map");

			// Show terms content and hide list content
			termsLink.addEventListener("click", function (event) {
				event.preventDefault();
				termsContent.style.display = "block";
				listContent.style.display = "none";
				mapcontent.style.display = "none";
			});

			// Show list content and hide terms content
			listLink.addEventListener("click", function (event) {
				event.preventDefault();
				termsContent.style.display = "none";
				listContent.style.display = "block";
				mapcontent.style.display = "none";
			});
			listmap.addEventListener("click", function (event) {
				event.preventDefault();
				showMap()
				termsContent.style.display = "none";
				listContent.style.display = "none";
			});

			// Initially hide list content
			listContent.style.display = "none";
		});
		var map;
		var mapInitialized = false;

		// Define custom icon using Font Awesome
		var customIcon = L.divIcon({
			html: '<i class="fa fa-map-pin" style="color:red;font-size:15px" title="Click here"></i>',
			iconSize: [32, 32],
			className: 'custom-icon'
		});

		function showMap() {
			var mapElement = document.getElementById("map");
			mapElement.style.display = 'block';
			//console.log('Map container made visible');

			if (!mapInitialized) {
				mapInitialized = true;
				//console.log('Initializing map after delay');
				setTimeout(mapInit, 100); // Delay to ensure the map container is rendered
			}

			// Call anotherFunction after the map is shown
			anotherFunction();
		}

		function mapInit() {
			//console.log('Initializing map');
			map = L.map('map').setView([14.57199865451665, 85.67084692525447], 4);

			L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				attribution: 'Map data © OpenStreetMap contributors',
				maxZoom: 19
			}).addTo(map);

			fetchHallCoordinates();
		}

		function fetchHallCoordinates() {
			//console.log('Fetching hall coordinates');
			$.ajax({
				url: '/victoriahallbooking_uat/user/api/getallhallcoordinates',
				type: 'GET',
				success: function (data) {
					//console.log('Data fetched successfully:', data);

					if (data.length === 0) {
						console.warn('No data returned from the API');
						return;
					}

					map.setView([parseFloat(data[0].latitude), parseFloat(data[0].longitude)], 10);

					data.forEach(function (coord) {
						//console.log('Processing coordinate:', coord);

						var marker = L.marker([parseFloat(coord.latitude), parseFloat(coord.longitude)], {icon: customIcon}).addTo(map);

						var hallImages = coord.hallImage;
						// Generate modal content with Bootstrap card and grid
						var hallImageHtml = '';
						if (hallImages && Array.isArray(hallImages) && hallImages.length > 0) {
							hallImageHtml += '<div class="image-container">';
							hallImages.forEach(function (image) {
								// Add a class to the image to specify fixed size
								hallImageHtml += '<img src="' + image.hallImage + '" class="img-fluid fixed-size-image" alt="Hall Image">';
							});
							hallImageHtml += '</div>';
						}



						var modalContent = '<div class="card border-primary">' +
							hallImageHtml +
							'<div class="card-body bg-light" style="text-align:left">' +
							'<p class="card-text">Hall Name: <strong>' + coord.hallName + '</strong></p>' +
							'<div class="row mb-2" >' +
							'<div class="col-12">' +
							'<p class="card-text">Address: <strong> ' + coord.doorNo + ',' + coord.area + ',' + coord.street + ',' + coord.landMark + '</strong></p>' +
							'</div>' +
							'</div>' +
							'<div class="row mb-2">' +
							'<div class="col-6">' +
							'<p class="card-text">Seating Capacity: <strong> ' + coord.seatingCapacity + '</strong></p>' +
							'</div>' +
							'<div class="col-6">' +
							'<p class="card-text">Parking Capacity: <strong> ' + coord.parkingCapacity + '</strong></p>' +
							'</div>' +
							'</div>' +
							'<div class="row mb-2">' +
							'<div class="col-6">' +
							'<p class="card-text">Deposit Amount: <strong> Rs. ' + coord.depositAmount + '</strong></p>' +
							'</div>' +
							'<div class="col-6">' +
							'<p class="card-text">Full Day Rent: <strong> Rs. ' + coord.fullDayRent + '</strong></p>' +
							'</div>' +
							'</div>' +
							'<div class="row mb-2">' +
							'<div class="col-6">' +
							'<p class="card-text">Half Day Rent: <strong> Rs. ' + coord.halfDayRent + '</strong></p>' +
							'</div>' +
							'</div>' +
							'</div>' +
							'</div>';


						marker.on('click', function () {
							$('#modalContent').html(modalContent);
							$('#hallDetailsModal').modal('show');

							// Add event listener to "Book Now" button in modal
							$('#hallDetailsModal').on('click', '.booknow', function () {
								redirectToPage(coord.hallId); // Pass hallId to redirectToPage function
							});
						});



						// Add hover event to show tooltip
						marker.on('mouseover', function (e) {
							var tooltip = L.tooltip({
								permanent: false,
								direction: 'top',
								className: 'custom-tooltip'
							})
								.setContent('Click here')
								.setLatLng(e.latlng);
							marker.bindTooltip(tooltip).openTooltip();
						});

						marker.on('mouseout', function () {
							marker.closeTooltip();
						});
					});
				},
				error: function (xhr, status, error) {
					console.error('Error fetching locations:', error);
				}
			});
		}

		function redirectToPage(hallId) {
			window.location.href = '/hallbookingform?hallId=' + hallId;
		}

		function anotherFunction() {
			//console.log('Another function called');
		}
	</script>
