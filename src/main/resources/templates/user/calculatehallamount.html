<script>

	function getHallDetails(hallId, callback) {
		$.ajax({
			type: 'GET',
			url: '/victoriahallbooking_uat/user/api/gethalldetails/' + hallId,
			success: function (response) {
				callback(response);
			},
			error: function (xhr, status, error) {
				//console.error('Error fetching hall details:', error);
			}
		});
	}

	// Get hallId from URL parameters and fetch hall details
	const urlParams = new URLSearchParams(window.location.search);
	const hallId = urlParams.get('hallId');
	$(document).ready(function () {
		if (hallId != null) {
			getHallDetails(hallId, function (response) {

				$('#hallIdDuplicate').val(hallId);
				$('#selecthall').val(hallId);
				$('#fullDayAmount').data('amount', response.fullDayRent);
				$('#halfDayAmount').data('amount', response.halfDayRent);
				$('#depositAmount').data('amount', response.depositAmount);
				$('#gst').data('rate', response.gst);
				$('#amountDetails').show();
				$('#selecthall').prop('disabled', true);
			});
		}
	});

	// Populate the dropdown options with the received hall names
	$(function () {
		$("#selecthall").select2();
	});

	$.ajax({
		type: 'GET',
		url: '/victoriahallbooking_uat/user/api/gethallnames',
		success: function (response) {
			var selectHallDropdown = $('#selecthall');
			$.each(response, function (index, hall) {
				selectHallDropdown.append($('<option></option>').attr('value', hall.hallId).text(hall.hallName));
				if (hallId == hall.hallId) {
					selectHallDropdown.find('option[value="' + hall.hallId + '"]').prop('selected', true);
				}
			});
		},
		error: function (xhr, status, error) {
			console.error('Error fetching hall names:', error);
		}
	});

	// Event listener for the Select Hall dropdown change
	$('#selecthall').change(function () {
		localStorage.clear();
		var hallId = $(this).val();
		if (hallId) {
			getHallDetails(hallId, function (response) {

				localStorage.setItem("isSGE",response.sge); // Fetch SGE status from the response
				localStorage.setItem("isCGE",response.cge);

				$('#fullDayAmount').text(response.fullDayRent.toFixed(2));
				$('#halfDayAmount').text(response.halfDayRent.toFixed(2));
				$('#depositAmount').text(response.depositAmount.toFixed(2));
				$('#gst').text(response.gst.toFixed(0) + '%');
				$('#reasonforBooking').val('');
				$('#numDaysCount').val(''); // Clear the numDaysCount dropdown
				$('#selectedhallId').val(hallId);
				// Reset the startDate and endDate fields
				$('#startPeriodDropdown').val('');
				$('#endPeriodDropdown').val('');
				$('#totalAmountDiv').hide();

				/*if (!isSGE) {
                    $('#reasonforBookingdiv').hide();
                }*/
				// $('#reasonforBookingdiv').show();


				// Show the required amount details once hall is selected
				$('#amountDetails').show();
			});
		} else {
			// Hide the amount details if no hall is selected
			$('#amountDetails').hide();
		}
	});

	function calculateAmount(numDays, startPeriod, endPeriod, fullDayAmount, halfDayAmount) {
		var amount = 0;

		// If there is only one day
		if (numDays === 1) {
			if (startPeriod === "1" && endPeriod === "2") {
				amount = fullDayAmount;
			} else if (startPeriod === "1" && endPeriod === "1") {
				amount = halfDayAmount;
			} else if (startPeriod === "2" && endPeriod === "2") {
				amount = halfDayAmount;
			}
		} else {
			// For multiple days
			if (startPeriod === "1" && endPeriod === "2") {
				amount = fullDayAmount * numDays;
			} else if (startPeriod === "1" && endPeriod === "1") {
				amount = fullDayAmount * (numDays - 1) + halfDayAmount;
			} else if (startPeriod === "2" && endPeriod === "2") {
				amount = fullDayAmount * (numDays - 1) + halfDayAmount;
			}
			else if (startPeriod === "2" && endPeriod === "1") {
				amount = fullDayAmount * (numDays - 2) + halfDayAmount * 2;
			}
		}

		return amount;
	}

	function calculateGST(amount, gstRate) {
		return parseFloat(((amount * gstRate) / 100).toFixed(2));
	}
	function handlePeriodDropdowns(numDays, startPeriod) {
		if (numDays === 1 && startPeriod === "2") {
			$('#endPeriodDropdown').val("2");
			$('#endPeriodDropdown').prop('disabled', true);
		} else {
			$('#endPeriodDropdown').prop('disabled', false);
		}
	}

	$('#numDaysCount').change(function () {
		var numDays = parseInt($(this).val(), 10);
		var startPeriod = $('#startPeriodDropdown').val();
		handlePeriodDropdowns(numDays, startPeriod);
	});

	$('#startPeriodDropdown').change(function () {
		var numDays = parseInt($('#numDaysCount').val(), 10);
		var startPeriod = $(this).val();
		handlePeriodDropdowns(numDays, startPeriod);
	});

	$('#calculateButton').click(function () {
		/*alert(hallId);*/
		var hallId = $('#selectedhallId').val();
		/*alert("hallId:-"+hallId);*/
		if(hallId == undefined || hallId == ''){
			/*alert($('#hallIdDuplicate').val())*/
			hallId = $('#hallIdDuplicate').val();
			/*alert("hallId done :-"+hallId);*/

		}
		var numDays = parseInt($('#numDaysCount').val(), 10);
		var startPeriod = $('#startPeriodDropdown').val();
		var endPeriod = $('#endPeriodDropdown').val();
		var reasonForBooking = $('#reasonforBooking').val();
		// console.log("reasonForBooking="+reasonForBooking);

		if (reasonForBooking.trim() === '') {
			$('#reasonforBooking')[0].setCustomValidity('Please select reason for booking.');
			$('#reasonforBooking')[0].reportValidity();
			return;
		} else {
			$('#reasonforBooking')[0].setCustomValidity('');
		}

		// Validate input fields
		if (isNaN(numDays) || numDays < 1 || numDays > 7) {
			console.log("num of days")
			$('#numDaysCount')[0].setCustomValidity('Please select a valid number of days.');
			$('#numDaysCount')[0].reportValidity();
			return;
		}
		if (startPeriod === '') {
			$('#startPeriodDropdown')[0].setCustomValidity('Please select valid start period.');
			$('#startPeriodDropdown')[0].reportValidity();
			return;
		} else {
			$('#startPeriodDropdown')[0].setCustomValidity('');
		}

		if (endPeriod === '') {
			$('#endPeriodDropdown')[0].setCustomValidity('Please select valid end period.');
			$('#endPeriodDropdown')[0].reportValidity();
			return;
		} else {
			$('#endPeriodDropdown')[0].setCustomValidity('');
		}

		if (reasonforBooking === 'SGE') {
			var startPeriod = $('#startPeriodDropdown').val("1");
			var endPeriod = $('#endPeriodDropdown').val("2");
		}

		$.ajax({
			type: 'GET',
			url: '/victoriahallbooking_uat/user/api/calculatehallamount',
			data: {
				hallId: hallId,
				numDays: numDays,
				startPeriod: startPeriod,
				endPeriod: endPeriod,
				reasonforBooking: reasonForBooking
			},
			success: function (response) {
				// console.log(response);

				// Update HTML elements with the response data
				if ((response.reasonforBooking === 'SGE') || (response.reasonforBooking === 'CGE')) {
					if(response.startperiod==='1' && response.endPeriod === '2'){
						$('#actualhallAmount_td').text('₹' + response.fulldayhallAmount);
					}else{
						$('#actualhallAmount_td').text('₹' + response.halfdayhallAmount);
					}
					document.getElementById("additionalcharges").style.display = 'table-row'; // Show row
					document.getElementById("additionalcharges_tr").style.display = 'table-row'
					$('#discount_td').text(response.discount + '%');
					$("#rentamount_td").html(response.rentAmount);
					$("#additionalcharges_td").html('₹'+response.additionalCharges);
					$('#hallAmount_td').text('₹' + response.netAmount);
					$('#gst_td').text('₹' + response.gst);
					$('#depositAmount_td').text('₹' + response.depositAmount);
					$('#totalAmount_td').text('₹' + response.totalAmount);
					$('#totalAmountDiv').show();
				} else {
					$('#actualhallAmount_td').text('₹' + response.amount);
					$('#discount_td').text(response.discount + '%');
					$('#hallAmount_td').text('₹' + response.discountAmount);
					$('#gst_td').text('₹' + response.gst);
					$('#depositAmount_td').text('₹' + response.depositAmount);
					$('#totalAmount_td').text('₹' + response.totalAmount);
					document.getElementById("additionalcharges").style.display = 'none'; // Hide row
					document.getElementById("additionalcharges_tr").style.display = 'none'; // Hide row

					// Show the total amount div
					$('#totalAmountDiv').show();
				}
			},
			error: function (xhr, status, error) {
				console.error('Error occurred: ' + error);
			}
		});
	});

	document.addEventListener("DOMContentLoaded", function () {
		const reasonDropdown = document.getElementById("reasonforBooking");
		const numDaysDropdown = document.getElementById("numDaysCount");
		const startPeriodDropdown = document.getElementById("startPeriodDropdown");
		const endPeriodDropdown = document.getElementById("endPeriodDropdown");

		reasonDropdown.addEventListener("change", function () {
			const selectedValue = reasonDropdown.value;

			if (selectedValue === "MARRIAGE" || selectedValue === "COMMERCIAL") {
				// Enable dropdowns for Marriage and Commercial
				numDaysDropdown.disabled = false;
				numDaysDropdown.value = ""; // Allow the user to select
				startPeriodDropdown.disabled = false;
				startPeriodDropdown.value = ""; // Allow the user to select
				endPeriodDropdown.disabled = false;
				endPeriodDropdown.value = ""; // Allow the user to select
			} else {
				// Set to one day and disable for other events
				numDaysDropdown.value = "1";
				numDaysDropdown.disabled = true;

				// Reset and disable start and end period dropdowns
				startPeriodDropdown.value = "";
				startPeriodDropdown.disabled = false;
				endPeriodDropdown.value = "";
				endPeriodDropdown.disabled = false;
			}
		});
	});

	$('#reasonforBooking').change(function () {
		var isSGE = localStorage.getItem("isSGE") === "true";
		var isCGE = localStorage.getItem("isCGE") === "true";

		document.getElementById("numDaysCount").disabled = false;

		var reasonForBooking = $('#reasonforBooking').val();

		if ((reasonForBooking === 'SGE' && !isSGE) || (reasonForBooking === 'CGE' && !isCGE)) {
			// Show popup for Government Events
			Swal.fire({
				title: 'Government Event',
				text: 'Shenoy Nagar Community Center (Auditorium) full Mandapam (Amma Arangam) is available for state government events.',
				icon: 'info',
				confirmButtonText: 'OK'
			}).then((result) => {
				if (result.isConfirmed) {
					window.location.reload();
				}
			});
		}
	});




</script>
