<style>
	/* Hide button and div2 on small screens */
	@media only screen and (max-width: 768px) {
		#toggleButton {
			display: none;
		}

		#div2 {
			display: none;
		}

		.table-container {
			height: 300px;
			/* Adjust height as needed */
			overflow-y: auto;
		}
	}

	/* Optional CSS styling */
	.thumbnail {
		cursor: pointer;
	}

	.modal-dialog {
		margin: 30px auto;
	}

	.carousel-item img {
		width: 100%;
		height: auto;
	}



	/* Custom CSS to change the color of carousel controls */
	.carousel-control-prev,
	.carousel-control-next {
		color: black;
	}

	#enteredDetails {
		display: none
	}

	.card {
		max-height: 75%;
	}

	#scrollToTopBtn {
		display: none;
		position: fixed;
		bottom: 20px;
		right: 30px;
		height: 45px;
		width: 45px;
		z-index: 99;
		border: none;
		outline: none;
		background-color: #FA7F08;
		color: white;
		cursor: pointer;
		padding: 15px;
		border-radius: 50%;
		opacity: 50%;
	}

	#scrollToTopBtn:hover {
		background-color: #22BABB;
		opacity: 100%;
	}

	.required-field {
		color: red;
	}

	#amounttable {
		border-collapse: separate;
		border-spacing: 5px;
		/* Set cell spacing */
		margin-bottom: 5px;
		/* margin-left:30px;  */
	}


	#amounttable th {
		padding: 2px;
		/* Set cell padding */
		border: none;
		text-align: center;
		padding: 0px 1px;
		width: 65%;
		font-size: 12px;
	}

	#amounttable td {
		padding: 2px;
		/* Set cell padding */
		border: none;
		text-align: left;
		width: 35%;
		font-size: 12px;
	}

	.swal2-container {
		z-index: 9999999999999 !important;
		/* Adjust this value if needed */
	}

	.image-container {
		overflow: hidden;
		white-space: nowrap;
	}

	.image-container img {
		display: inline-block;
		margin-right: 10px;
		/* Adjust as needed */
		animation: scrollImages 5s linear infinite;
		/* Adjust duration and timing function as needed */
	}

	@keyframes scrollImages {
		0% {
			transform: translateX(0);
		}

		100% {
			transform: translateX(-100%);
		}
	}

	#map {
		height: 700px;
		/* Adjust height as needed */
		width: 100%;
		position: relative;
		overflow: hidden;
		max-width: 100%;
		/* Ensure the map doesn't overflow its container */
	}

	.border-primary {
		border-left: white;
	}

	.swal2-container {
		z-index: 9999999999999 !important;
		/* Adjust this value if needed */
	}

	.carousel-inner img {
		object-fit: cover;
		/* Ensures images scale uniformly */
		height: 250px;
		/* Fixed height */
		width: 300px;
		/* Fixed width */
		margin: auto;
		/* Centers the image */
		margin-top: 20px;
	}

	.carousel {
		display: flex;
		justify-content: center;
		/* Center the carousel itself */
	}

	.carousel-image {
		max-height: 300px;
		/* Adjust height as needed */
		width: auto;
		margin: 0 auto;
		/* Center the image horizontally */
	}

	

</style>

			function formatDateForText(date) {
				var day = ("0" + date.getDate()).slice(-2);
				var month = ("0" + (date.getMonth() + 1)).slice(-2); // Months are zero-based
				var year = date.getFullYear();
				return day + '-' + month + '-' + year;
			}

			// Function to format date as yyyy-mm-dd
			function formatDateForValue(date) {
				var day = ("0" + date.getDate()).slice(-2);
				var month = ("0" + (date.getMonth() + 1)).slice(-2); // Months are zero-based
				var year = date.getFullYear();
				return year + '-' + month + '-' + day;
			}

								            <a class="carousel-control-next" href="#hallImageCarousel" role="button" data-slide="next">
								                <span class="carousel-control-next-icon" aria-hidden="true"></span>
								                <span class="sr-only">Next</span>
								            </a>
								        </div>
								    `;
								} else {
									console.warn('coord.hallImage is either undefined, not an array, or empty.');
								}

								//console.log(hallImageHtml); // Log the final HTML for debugging purposes


								var modalContent = `
						<div class="card border-primary">
							<div class="imagecontainer">${hallImageHtml}</div>
							<div class="card-body bg-light" style="text-align:left">
								<p class="card-text">Hall Name: <strong>${coord.hallName}</strong></p>
								<p class="card-text">Address: <strong>${coord.doorNo}, ${coord.area}, ${coord.street}, ${coord.landMark}</strong></p>
								<p class="card-text">Seating Capacity: <strong>${coord.seatingCapacity}</strong></p>
								<p class="card-text">Parking Capacity: <strong>${coord.parkingCapacity}</strong></p>
								<p class="card-text">Deposit Amount: <strong>Rs. ${coord.depositAmount}</strong></p>
								<p class="card-text">Full Day Rent: <strong>Rs. ${coord.fullDayRent}</strong></p>
								<p class="card-text">Half Day Rent: <strong>Rs. ${coord.halfDayRent}</strong></p>
								<p class="card-text">Hall Area: <strong>${coord.hallArea} (sq.ft)</strong></p>
							</div>
						</div>`;

								marker.on('click', function () {
									$('#modalContent').html(modalContent);
									$('#hallDetailsModal').modal('show');
									$('#hallDetailsModal').on('click', '.booknow', function () {
										redirectToPage(coord.hallId);
									});
								});

								var tooltipContent = `<p class="card-text">Hall Name: <strong>${coord.hallName}</strong></p>`;
								marker.bindTooltip(tooltipContent, {
									direction: 'top',
									permanent: false,
									className: 'custom-tooltip'
								});

								markers.addLayer(marker);
							});

							map.addLayer(markers);
						},
						error: function (xhr, status, error) {
							console.error('Error fetching locations:', error);
						}
					});
				}, 100); // Delay to ensure the map container is rendered
			}

			// Call anotherFunction after the map is shown
			anotherFunction();
		}

		function redirectToPage(hallId) {
			alert(hallId);
			window.location.href = '/victoriahallbooking_uat/hallbookingform?hallId=' + hallId;
		}

		function anotherFunction() {
			//console.log('Another function called');
		}

		function resetDate() {
			window.location.href = "/victoriahallbooking_uat/user/dashboard";
		}

		function showHall(element) {
			const latitude = element.getAttribute('data-latitude');
			const longitude = element.getAttribute('data-longitude');

			var mapElement = document.getElementById("map");
			var dashboardBody = document.getElementById("dashboardbody");

			if (mapElement.style.display === "none") {
				mapElement.style.display = "block";
				dashboardBody.style.display = "none";
			} else {
				mapElement.style.display = "none";
				dashboardBody.style.display = "block";
			}

			mapElement.style.display = 'block';
			//console.log('Map container made visible');

			if (!mapInitialized) {
				mapInitialized = true;
				setTimeout(() => {
					map = L.map('map', { attributionControl: false }).setView([latitude, longitude], 18);

					L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
						attributionControl: false,
						maxZoom: 19
					}).addTo(map);

					var markers = L.markerClusterGroup();
					$.ajax({
						url: '/victoriahallbooking_uat/user/api/getallhallcoordinates',
						type: 'GET',
						success: function (data) {
							if (data.length === 0) {
								console.warn('No data returned from the API');
								return;
							}
							data.forEach(function (coord) {
								var marker = L.marker([parseFloat(coord.latitude), parseFloat(coord.longitude)], /{icon: customIcon}/);
								if (coord.hallImage && Array.isArray(coord.hallImage) && coord.hallImage.length > 0) {
									hallImageHtml = `
								        <div id="hallImageCarousel" class="carousel slide" data-ride="carousel">
								            <div class="carousel-inner">
								                ${coord.hallImage.map((image, index) => `
								                    <div class="carousel-item ${index === 0 ? 'active' : ''}">
								                        <img src="${image.hallImage}" class="d-block w-100 fixed-size-image" alt="Hall Image">
								                    </div>
								                `).join('')}
								            </div>
								            <a class="carousel-control-prev" href="#hallImageCarousel" role="button" data-slide="prev">
								                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
								                <span class="sr-only">Previous</span>
								            </a>
								            <a class="carousel-control-next" href="#hallImageCarousel" role="button" data-slide="next">
								                <span class="carousel-control-next-icon" aria-hidden="true"></span>
								                <span class="sr-only">Next</span>
								            </a>
								        </div>
								    `;
								} else {
									console.warn('coord.hallImage is either undefined, not an array, or empty.');
								}

								var modalContent = `
						<div class="card border-primary">
							<div class="imagecontainer">${hallImageHtml}</div>
							<div class="card-body bg-light" style="text-align:left">
								<p class="card-text">Hall Name: <strong>${coord.hallName}</strong></p>
								<p class="card-text">Address: <strong>${coord.doorNo}, ${coord.area}, ${coord.street}, ${coord.landMark}</strong></p>
								<p class="card-text">Seating Capacity: <strong>${coord.seatingCapacity}</strong></p>
								<p class="card-text">Parking Capacity: <strong>${coord.parkingCapacity}</strong></p>
								<p class="card-text">Deposit Amount: <strong>Rs. ${coord.depositAmount}</strong></p>
								<p class="card-text">Full Day Rent: <strong>Rs. ${coord.fullDayRent}</strong></p>
								<p class="card-text">Half Day Rent: <strong>Rs. ${coord.halfDayRent}</strong></p>
								<p class="card-text">Hall Area: <strong>${coord.hallArea} (sq.ft)</strong></p>
							</div>
						</div>`;

								marker.on('click', function () {
									$('#modalContent').html(modalContent);
									$('#hallDetailsModal').modal('show');
									$('#hallDetailsModal').on('click', '.booknow', function () {
										redirectToPage(coord.hallId);
									});
								});

								var tooltipContent = `<p class="card-text">Hall Name: <strong>${coord.hallName}</strong></p>`;
								marker.bindTooltip(tooltipContent, {
									direction: 'top',
									permanent: false,
									className: 'custom-tooltip'
								});

								markers.addLayer(marker);
							});

							map.addLayer(markers);
						},
						error: function (xhr, status, error) {
							console.error('Error fetching locations:', error);
						}
					});
				}, 100); // Delay to ensure the map container is rendered
			}
		}
	</script>
