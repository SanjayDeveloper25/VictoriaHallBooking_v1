		function addimg(x) {
			document.getElementById("myImg").src = "data:image/jpeg;base64," + x;

		function accept() {
			let id = document.getElementById("uniqid").value;
			Swal.fire({
				title: 'Do you want to Accept this Pet ?',
				showDenyButton: true,
				showCancelButton: true,
				confirmButtonText: 'YES',
				denyButtonText: `NO`,
			}).then((result) => {
				/* Read more about isConfirmed, isDenied below */
				if (result.isConfirmed) {
					$.ajax({
						type: "GET",
						url: '/api/accept',
						data: {'id': id},
						success: function (bodyMessage) {
							if (bodyMessage == "success") {
								Swal.fire(
									'Done',
									'Successfully Accepted to the ID:' + id,
									'success'
								).then(() => {
									location.reload();
								});
							}
						}
					});
				} else if (result.isDenied) {
					Swal.fire('Changes are not saved', '', 'info')
				}
			})
		}

		function reject(list) {
			$('#rejectForm').modal({
				backdrop: 'static',
				keyboard: false
			});
			$('#rejectForm').modal('show');
			document.getElementById("uniqid").value = list.uniqueid;
			document.getElementById("petna").value = list.petname;
			document.getElementById("speci").value = list.species;
			document.getElementById("bre").value = list.breed;
			document.getElementById("gend").value = list.gender;
			document.getElementById("age").value = list.age;

			document.getElementById("arvd").value = list.arvdate;
			document.getElementById("dewormdate").value = list.dewormdate;
			document.getElementById("othervac").value = list.othervac;
			document.getElementById("previoslicenseNo").value = list.previoslicenseNo;
			document.getElementById("VeterinaryConsultant").value = list.veterinaryConsultant;
			document.getElementById("TNVCNo").value = list.tnvcno;
			document.getElementById("registerdate").value = list.registerdate;




		}
		function rejectsubmit() {
			var reason = $("#reason").val();
			var id = $("#uniqid").val();

			Swal.fire({
				title: 'Do you want to Reject this Pet ?',
				showDenyButton: true,
				showCancelButton: true,
				confirmButtonText: 'YES',
				denyButtonText: `NO`,
			}).then((result) => {
				/* Read more about isConfirmed, isDenied below */
				if (result.isConfirmed) {
					$.ajax({
						type: "GET",
						url: '/api/reject',
						data: {'id': id, 'reason': reason},
						success: function (bodyMessage) {
							if (bodyMessage == "success") {
								Swal.fire(
									'Done',
									'Successfully Rejected to the ID:' + id,
									'success'
								).then(() => {
									location.reload();
								});
							}

						}

					});

				} else if (result.isDenied) {
					Swal.fire('Changes are not saved', '', 'info')
				}
			})

			return false;

		}

		$(document).ready(function () {

			$('.datepicker').datepicker({

			$('.datepicker').keyup(function () {

		function getbydate() {
			var x = document.getElementById("fromdate").value;
			var y = document.getElementById("todate").value;
			$.ajax({

				url: '/api/getbydate',
				data: {

					'todate': y

				success: function (x) {
					if (x == "ok") {
						location.reload();
					}

			});

		function resetDate() {

					}
				}
			});
		}



		class pageDashboard {
			/*
			 * Init Charts
			 *
			 */
			static initChartsBars() {
				// Set Global Chart.js configuration
				Chart.defaults.color = '#818d96';
				Chart.defaults.scale.grid.color = 'transparent';
				Chart.defaults.scale.grid.zeroLineColor = 'transparent';
				Chart.defaults.scale.beginAtZero = true;
				Chart.defaults.elements.line.borderWidth = 1;
				Chart.defaults.plugins.legend.labels.boxWidth = 12;

				// Get Chart Containers
				let chartBarsCon = document.getElementById('js-chartjs-analytics-bars');

				// Set Chart and Chart Data variables
				let chartBars, chartLinesBarsData;
				const acceptedBookings = [];
				const rejectedBookings = [];
				const pendingBookings = [];
				const labels = [];

				var monthcounts = [[${monthcounts}]];
				monthcounts.forEach(item => {
					labels.push(item.months);

					acceptedBookings.push(item.approved_count);
					rejectedBookings.push(item.rejected_count);
					pendingBookings.push(item.pending_count);
				});



				// Bars Chart Data
				chartLinesBarsData = {
					//labels: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'],
					labels: labels,

					datasets: [
						{
							label: 'Accept Booking',
							fill: true,
							backgroundColor: '#c7d7e6',
							borderColor: 'transparent',
							pointBackgroundColor: '#c7d7e6',
							pointBorderColor: '#fff',
							pointHoverBackgroundColor: '#fff',
							pointHoverBorderColor: '#c7d7e6',
							data: acceptedBookings
						},
						{
							label: 'Rejected Booking',
							fill: true,
							backgroundColor: '#c2d7ab',
							borderColor: 'transparent',
							pointBackgroundColor: '#c2d7ab',
							pointBorderColor: '#fff',
							pointHoverBackgroundColor: '#fff',
							pointHoverBorderColor: '#c2d7ab',
							data: rejectedBookings
						},
						{
							label: 'Pending',
							fill: true,
							backgroundColor: '#e9cb91',
							borderColor: 'transparent',
							pointBackgroundColor: '#e9cb91',
							pointBorderColor: '#fff',
							pointHoverBackgroundColor: '#fff',
							pointHoverBorderColor: '#e9cb91',
							data: pendingBookings
						}
					]
				};

				// Init Chart
				if (chartBarsCon !== null) {
					chartBars = new Chart(chartBarsCon, {
						type: 'bar',
						data: chartLinesBarsData,
						options: {
							responsive: true,
							maintainAspectRatio: false,
							plugins: {
								tooltip: {
									callbacks: {
										label: function (context) {
											return context.dataset.label + ': ' + context.parsed.y + '';
										}
									}
								}
							}
						}
					});
				}
			}

			/*
			 * Init functionality
			 *
			 */
			static init() {
				this.initChartsBars();
			}
		}

		// Initialize when page loads
		Dashmix.onLoad(() => pageDashboard.init());


		$(function () {

			var start = moment().subtract(29, 'days');
			var end = moment();

			function cb(start, end) {
				$('#reportrange span').html(start.format('MMMM D, YYYY') + ' - ' + end.format('MMMM D, YYYY'));
			}

			$('#reportrange').daterangepicker({
				startDate: start,
				endDate: end,
				ranges: {
					'Today': [moment(), moment()],
					'Yesterday': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
					'Last 7 Days': [moment().subtract(6, 'days'), moment()],
					'Last 30 Days': [moment().subtract(29, 'days'), moment()],
					'This Month': [moment().startOf('month'), moment().endOf('month')],
					'Last Month': [moment().subtract(1, 'month').startOf('month'), moment().subtract(1, 'month').endOf('month')]
				}
			}, cb);

			cb(start, end);

		});

		var APPROVED = [[${APPROVED}]];
		var REJECTED = [[${REJECTED}]];
		var PENDING = [[${PENDING}]];




		var data = {
			labels: [' Approved', 'Rejected', 'pending'],
			datasets: [{
				data: [APPROVED, REJECTED, PENDING], // Values for each segment
				backgroundColor: ['#c7d7e6', '#c2d7ab', '#e9cb91'], // Colors for each segment
			}]
		};

		// Get the canvas element and create a pie chart
		var ctx = document.getElementById('myChart').getContext('2d');
		var myChart = new Chart(ctx, {
			type: 'doughnut',
			data: data,
		});

	</script>
